<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon carnet de recettes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&family=Young+Serif&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F7EF;--ink:#243020;--mute:#6A7563;--line:#DDE3D0;--card:#fff;--accent:#A8283A;--accent2:#E9A93A;--r:22px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:"Young Serif",Georgia,serif;font-weight:400;line-height:1.2;margin:0}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:20;background:rgba(245,247,239,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1460px;margin:auto;padding:12px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-family:"Young Serif",serif;font-size:1.25rem;margin-right:auto}
nav{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
nav a,nav button.navbtn{font:inherit;padding:8px 15px;border-radius:99px;font-weight:500;border:0;background:transparent;color:var(--ink);cursor:pointer}
nav a.on{background:var(--ink);color:#fff}
nav a.add{background:var(--accent);color:#fff}
.netbar{background:#7A1F1F;color:#fff;text-align:center;padding:8px 16px;font-size:.9rem;font-weight:500}
.netbar.ok{background:#2F6F3E}
main{max-width:1460px;margin:auto;padding:28px 24px 80px}
.find{margin-bottom:24px}.find h1{font-size:clamp(1.7rem,4vw,2.5rem);margin-bottom:12px}
.searchrow{display:flex;gap:10px;flex-wrap:wrap}
input,select,textarea{font:inherit;color:inherit;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:11px 14px;width:100%}
input:focus,select:focus,textarea:focus,.btn:focus-visible,a:focus-visible{outline:3px solid var(--accent2);outline-offset:1px}
.searchrow input{flex:1;min-width:220px}
.btn{font:inherit;font-weight:700;border:0;border-radius:14px;padding:11px 20px;background:var(--ink);color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.pri{background:var(--accent)}.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}.btn.del{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}.btn.sm{padding:8px 14px;font-size:.9rem;border-radius:12px}
.btn.okbtn{background:#2F6F3E;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}

/* ============ Recadrage strict au centre exact (50% 50%) ============ */
.card{background:var(--card);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-width:0;box-shadow:0 1px 0 var(--line),0 8px 24px -16px rgba(36,48,32,.35);transition:transform .2s;position:relative}
.card:hover{transform:translateY(-3px)}
.ph{display:block;width:100%;aspect-ratio:4 / 3;overflow:hidden;flex:none;background:linear-gradient(135deg,#E6EBD6,#F3E2B7);position:relative;line-height:0;text-align:center;font-size:2.5rem}
.ph:not(:has(img)){display:grid;place-items:center;line-height:1}
.ph img,.hero img,.cover,.av img{width:100%;height:100%;object-fit:cover !important;object-position:50% 50% !important;display:block;margin:0;padding:0;border:0}
.badge{position:absolute;top:10px;right:10px;z-index:2;line-height:1.3;background:rgba(36,48,32,.84);color:#fff;font-size:.75rem;font-weight:700;padding:4px 10px;border-radius:99px;backdrop-filter:blur(4px)}
.badge.pub{background:rgba(47,111,62,.9)}.badge.copy{left:10px;right:auto;background:rgba(168,40,58,.9)}
.cb{padding:16px 18px 18px;display:flex;flex-direction:column;flex:1;min-width:0}
.cb h3{font-size:1.18rem;margin-bottom:6px;overflow-wrap:anywhere;word-break:break-word}
.cdesc{font-size:.9rem;color:var(--mute);margin:0 0 10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cauthor{font-size:.86rem;font-weight:700;color:var(--accent);margin-bottom:8px;display:inline-flex;align-items:center;gap:6px}
.meta{display:flex;gap:6px 12px;flex-wrap:wrap;color:var(--mute);font-size:.88rem;margin-top:auto}
.miss{margin-top:10px;font-size:.86rem;color:var(--accent)}.ok{color:#3C7A3C;font-weight:700;font-size:.86rem;margin-top:10px}
.muted{color:var(--mute)}.empty{padding:40px 24px;text-align:center;color:var(--mute);background:#fff;border-radius:var(--r)}
.err{background:#FBE4E4;color:#7A1F1F;padding:14px 18px;border-radius:14px;margin-bottom:14px}
.hero{display:block;width:100%;aspect-ratio:16 / 9;max-height:440px;border-radius:26px;overflow:hidden;position:relative;background:linear-gradient(135deg,#E6EBD6,#F3E2B7);font-size:4rem}
.hero:not(:has(img)){display:grid;place-items:center}
.rtitle{font-size:clamp(1.9rem,5vw,3rem);margin:20px 0 10px}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.chip{background:#fff;border:1.5px solid var(--line);border-radius:99px;padding:6px 16px;font-weight:500;font-size:.92rem}
.chip.pub{border-color:#2F6F3E;color:#2F6F3E;font-weight:700}.chip.priv{border-color:var(--mute);color:var(--mute)}
.prov{background:#FAF4E6;border:1.5px solid #E9D6A6;border-radius:14px;padding:10px 16px;margin-bottom:18px;font-size:.92rem;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}
.panel{background:#fff;border-radius:var(--r);padding:22px;margin-bottom:22px}
.panel h2{font-size:1.35rem;margin-bottom:14px}
.nut{display:grid;grid-template-columns:auto repeat(4,1fr);gap:8px 14px;align-items:baseline;overflow-x:auto}
.nut b{font-family:"Young Serif",serif;font-weight:400;font-size:1.25rem}.nut small{color:var(--mute)}
.ing{list-style:none;padding:0;margin:0}.ing li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.form label{display:block;font-weight:700;font-size:.92rem;margin:14px 0 6px}
.two,.three{display:grid;gap:14px}.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:repeat(3,1fr)}
.row{display:grid;grid-template-columns:1fr 170px 44px;gap:10px;margin-bottom:10px;align-items:center}
.mo{position:fixed;inset:0;z-index:100;background:rgba(36,48,32,.55);display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .15s}
.md{background:#fff;border-radius:24px;width:100%;max-width:460px;max-height:90vh;overflow:auto;padding:26px 24px 22px;box-shadow:0 24px 60px -20px rgba(0,0,0,.45);animation:pop .18s ease-out}
.md h2{font-size:1.4rem;margin-bottom:12px}.md p{margin:0;color:var(--mute)}.md .warn{color:var(--accent);margin-top:10px}
.md .nm{background:var(--bg);border-left:4px solid var(--accent);border-radius:10px;padding:10px 14px;font-weight:700;margin-bottom:14px;overflow-wrap:anywhere}
.md .err{margin-top:14px}.mb{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}.mb .btn{min-height:48px;padding:12px 22px}
.btn.danger{background:#C62828;color:#fff}.btn:disabled{opacity:.6;cursor:default}
@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.qw{position:relative}.qw input{padding-right:78px}
.qw .u{position:absolute;right:12px;top:50%;transform:translateY(-50%);max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mute);font-size:.85rem;pointer-events:none}
.cats,.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.pill,.tab{font:inherit;font-weight:500;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:99px;padding:7px 16px;cursor:pointer;transition:background .15s}
.pill.on,.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.x{border:0;background:#F0E3E3;color:var(--accent);border-radius:12px;height:44px;cursor:pointer;font-size:1.1rem}
.cover{width:100%;max-width:360px;height:auto;aspect-ratio:4 / 3;border-radius:18px;margin-bottom:10px}
.irow{display:grid;grid-template-columns:1fr auto;gap:10px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:99px;z-index:200;width:max-content;max-width:90vw;text-align:center;box-shadow:0 10px 25px rgba(0,0,0,.25)}
.toast.e{background:var(--accent)}
/* ============ Calendrier des repas ============ */
.cal-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.cal-spaces{display:flex;gap:8px;flex-wrap:wrap}
.cal-bar{background:#fff;border-radius:var(--r);padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;box-shadow:0 1px 0 var(--line),0 8px 24px -18px rgba(36,48,32,.3)}
.cal-nav{display:flex;align-items:center;gap:8px}
.cal-nav h2{font-size:1.3rem;min-width:190px;text-align:center;text-transform:capitalize}
.cal-nav .btn{padding:8px 13px;min-width:40px}
.cal-views{display:flex;gap:6px;background:var(--bg);padding:4px;border-radius:99px}
.cal-views button{font:inherit;font-size:.88rem;font-weight:600;border:0;background:transparent;color:var(--mute);padding:6px 14px;border-radius:99px;cursor:pointer}
.cal-views button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(36,48,32,.12)}
.cal-filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.cal-grid-wrap{background:#fff;border-radius:var(--r);padding:14px;box-shadow:0 1px 0 var(--line),0 8px 24px -18px rgba(36,48,32,.3)}
.cal-dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:6px;text-align:center;font-size:.82rem;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.03em}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-cell{min-height:126px;border:1.5px solid var(--line);border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:5px;background:#fff;min-width:0;transition:border-color .15s,background .15s}
.cal-cell.out{background:#FAFBF7;opacity:.58}
.cal-cell.today{border-color:var(--accent);background:#FFFDFB}
.cal-cell.sel{border-color:var(--ink);box-shadow:0 0 0 2px rgba(36,48,32,.12)}
.cal-cell-head{display:flex;align-items:center;justify-content:space-between;gap:4px}
.cal-daynum{font-weight:700;font-size:.9rem;width:26px;height:26px;border-radius:99px;display:grid;place-items:center}
.cal-cell.today .cal-daynum{background:var(--accent);color:#fff}
.cal-cell-add{border:0;background:var(--bg);color:var(--ink);width:26px;height:26px;border-radius:99px;font-weight:700;cursor:pointer;display:grid;place-items:center;font-size:1rem;line-height:1}
.cal-cell-add:hover{background:var(--ink);color:#fff}
.cal-dots{display:none}
.cal-mini-list{display:flex;flex-direction:column;gap:4px;min-width:0}
.cal-pill-meal{display:flex;align-items:center;gap:6px;padding:4px 7px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:.78rem;line-height:1.25;min-width:0;cursor:pointer;text-align:left}
.cal-pill-meal:hover{border-color:var(--ink)}
.cal-pill-meal img{width:22px;height:22px;border-radius:6px;object-fit:cover;flex:none}
.cal-pill-txt{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.mtype{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.mtype.petit-dejeuner{background:#FDF0D5;color:#8A5A00}
.mtype.dejeuner{background:#E3F1E6;color:#235D32}
.mtype.diner{background:#FBE4E7;color:#8E1E2E}
.mtype.autre{background:#ECEFE4;color:#4B5644}
.cal-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.cal-wday{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.cal-wday.today{border-color:var(--accent)}
.cal-wday-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:8px;border-bottom:1px solid var(--line)}
.cal-card{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px;width:100%}
.cal-card-thumb{width:52px;height:52px;border-radius:12px;object-fit:cover;flex:none;background:linear-gradient(135deg,#E6EBD6,#F3E2B7);display:grid;place-items:center;font-size:1.3rem}
.cal-card-body{min-width:140px;flex:1 1 180px}
.cal-card-title{font-weight:700;font-size:.98rem;line-height:1.35;display:block;overflow-wrap:break-word;word-break:normal;margin-top:4px}
.cal-card-title:hover{color:var(--accent)}
.cal-card-note{font-size:.84rem;color:var(--mute);margin-top:3px;overflow-wrap:break-word;word-break:normal}
.cal-card-acts{display:flex;gap:6px;flex:none;margin-left:auto}
.cal-wday .cal-card{padding:10px;gap:8px}
.cal-wday .cal-card-thumb{width:38px;height:38px;border-radius:10px;font-size:1rem}
.cal-wday .cal-card-body{min-width:0;flex:1 1 100%}
.cal-wday .cal-card-acts{width:100%;justify-content:flex-end;padding-top:6px;border-top:1px solid var(--line)}
.sc-bar{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sc-list{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sc-chip{font:inherit;font-size:.9rem;font-weight:600;padding:8px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.sc-chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.sc-role{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;background:rgba(36,48,32,.09);color:inherit}
.sc-chip.on .sc-role{background:rgba(255,255,255,.2)}
.sc-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.m-assign-wrap{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap;vertical-align:middle;margin-left:4px}
.m-assign{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;background:#EEF2E4;color:var(--ink)}
.m-assign.person{background:#FAF4E6;border:1px solid #E9D6A6;color:#6E4E0B;padding:1px 8px 1px 3px}
.m-assign .av.xs{width:18px;height:18px;font-size:.62rem}
.cal-pill-who{flex:none;font-size:.68rem;font-weight:700;padding:1px 6px;border-radius:99px;background:#fff;border:1px solid var(--line);color:var(--mute);max-width:74px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-pill-who.person{background:#FAF4E6;border-color:#E9D6A6;color:#6E4E0B}
.pm-assign-box{background:#FAFBF6;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:6px}
.pm-assign-chips{display:flex;gap:7px;flex-wrap:wrap}
.pm-who-btn{font:inherit;font-size:.86rem;font-weight:600;padding:7px 12px;border-radius:99px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.pm-who-btn.on{border-color:var(--accent);background:#FBE8EB;color:var(--accent)}
.pm-who-btn .av.xs{width:20px;height:20px;font-size:.66rem}
.inv-badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--accent);color:#fff;font-size:.74rem;font-weight:700;margin-left:6px}
.tab.on .inv-badge{background:#fff;color:var(--ink)}
.inv-box{background:#FAF4E6;border:1.5px solid #E9D6A6;border-radius:18px;padding:14px 16px;margin-bottom:16px}
.inv-box h3{font-size:1.05rem;margin-bottom:10px}
.inv-list{display:flex;flex-direction:column;gap:8px}
.inv-item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mem-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.mem-row:last-child{border-bottom:0}
.mem-user{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.mem-pick{width:100%;text-align:left;font:inherit;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer}
.mem-pick:hover{border-color:var(--ink)}#EEF2E4;color:var(--ink);margin-left:4px}
.sc-readonly-badge{font-size:.8rem;font-weight:700;padding:4px 10px;border-radius:99px;background:#FBE8EB;color:var(--accent)}
.mem-row{flex-wrap:wrap}
.mem-controls{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mem-role-sel{width:auto;padding:6px 10px;font-size:.82rem;font-weight:600;border-radius:10px;min-height:34px}
.perm-toggle{font:inherit;font-size:.78rem;font-weight:700;padding:6px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--mute);cursor:pointer;min-height:34px;white-space:nowrap}
.perm-toggle.on{border-color:#BFD9C3;background:#E8F3EA;color:#235730}
.role-guide{background:var(--bg);border-radius:12px;padding:9px 12px;font-size:.8rem;color:var(--mute);margin-bottom:10px;line-height:1.45}
.cal-filters{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.cal-fgroup{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cal-flabel{font-size:.76rem;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.03em;margin-right:2px}
.cal-pill-who-f{display:inline-flex;align-items:center;gap:6px;padding:5px 12px 5px 6px}
.cal-pill-who-f .av.xs{width:20px;height:20px;font-size:.64rem}
.cal-fstatus{display:flex;align-items:center;gap:8px;font-size:.84rem;color:var(--mute);margin-left:auto}
.cal-date-inp{width:auto;font:inherit;font-size:.84rem;font-weight:600;padding:6px 11px;border-radius:99px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;min-height:34px}
.cal-mob-daypanel{display:none}
.cal-list-group{margin-bottom:18px}
.cal-list-group h3{font-size:1.1rem;margin-bottom:8px;text-transform:capitalize}
.cal-act-btn{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-size:.95rem;font-weight:700;display:grid;place-items:center;cursor:pointer}
.cal-act-btn:hover{border-color:var(--ink)}
.cal-act-btn.del{border-color:#F3C6CB;background:#FBE8EB;color:var(--accent)}
.pm-types{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:6px}
.pm-type-btn{font:inherit;font-size:.9rem;font-weight:600;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;text-align:center}
.pm-type-btn.on{border-color:var(--accent);background:#FBE8EB;color:var(--accent)}
.pm-rec-list{display:flex;flex-direction:column;gap:6px;max-height:210px;overflow-y:auto;margin-top:8px;padding-right:2px}
.pm-rec-item{width:100%;text-align:left;font:inherit;background:#fff;border:1.5px solid var(--line);border-radius:13px;padding:8px 10px;display:flex;align-items:center;gap:10px;cursor:pointer}
.pm-rec-item.on{border-color:var(--accent);background:#FFF8F8}
.pm-rec-item img,.pm-rec-ph{width:40px;height:40px;border-radius:10px;object-fit:cover;flex:none;background:linear-gradient(135deg,#E6EBD6,#F3E2B7);display:grid;place-items:center;font-size:1.1rem}
.pm-quick-dates{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
/* Communauté : Auth, Profil, Utilisateurs, Dashboard */
.authbox{max-width:440px;margin:20px auto;background:#fff;border-radius:var(--r);padding:28px 26px;box-shadow:0 8px 30px -18px rgba(36,48,32,.35)}
.authbox h1{font-size:1.85rem;margin-bottom:8px}
.phead{background:#fff;border-radius:var(--r);padding:24px;margin-bottom:22px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}

<body>
<header>
  <div id="netbar" class="netbar" hidden></div>
  <div class="bar"><a class="logo" href="#/">Mon carnet de recettes</a><nav id="nav"></nav></div>
</header>
<main id="app"></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
/* ============ Outils & État global ============ */
const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stepsToText = s => Array.isArray(s) ? s.join('\n') : (s ?? '');
const norm = s => String(s ?? '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
const fmt = v => (Math.round((+v || 0) * 10) / 10).toLocaleString('fr-FR');
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? 0 : n; };
const debounce = (fn, ms = 300) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

function toast(msg, err) {
  document.querySelectorAll('.toast').forEach(x => x.remove());
  const t = document.createElement('div');
  t.className = 'toast' + (err ? ' e' : '');
  t.textContent = msg;
  document.body.append(t);
  setTimeout(() => t.remove(), err ? 4500 : 3200);
}

/* ============ Délai d'attente (Timeout) & Traduction d'erreurs ============ */
function withTimeout(promise, ms = 18000, label = 'La requête') {
  let timer;
  const timeout = new Promise((_, reject) => {
    timer = setTimeout(() => {
      const err = new Error(`${label} a pris trop de temps. Vérifiez votre connexion et réessayez.`);
      err.code = 'CLIENT_TIMEOUT';
      reject(err);
    }, ms);
  });
  return Promise.race([promise, timeout]).finally(() => clearTimeout(timer));
}

function humanizeError(err) {
  if (!navigator.onLine) return 'Vous êtes hors ligne. Vos données sont conservées : réessayez dès que la connexion revient.';
  const code = String(err?.code || '');
  const status = Number(err?.status || err?.statusCode || 0);
  const msg = String(err?.message || err || '');

  if (code === 'CLIENT_TIMEOUT' || err?.name === 'AbortError') {
    return 'La connexion au serveur a expiré (délai dépassé). Vos données n’ont pas été effacées, vous pouvez réessayer.';
  }
  if (code === 'SESSION_EXPIRED' || status === 401 || /jwt expired|invalid jwt|refresh_token|not authenticated/i.test(msg)) {
    return 'Votre session a expiré. Vos saisies sont sauvegardées localement : reconnectez-vous pour enregistrer.';
  }
  if (code === '23503') return 'Cet ingrédient est utilisé dans une recette : retirez-le d’abord.';
  if (code === '23505') return 'Cet élément existe déjà dans la base de données.';
  if (code === '42501' || status === 403) return 'Action non autorisée sur cette ressource.';
  if (status === 429) return 'Trop de requêtes envoyées. Patientez quelques secondes avant de réessayer.';
  if (/failed to fetch|networkerror|load failed|network request failed/i.test(msg)) {
    return 'Impossible de joindre le serveur (coupure réseau temporaire). Réessayez dans un instant.';
  }
  return msg || 'Une erreur inattendue est survenue.';
}

const ok = ({ data, error }) => {
  if (error) {
    console.error('[Supabase Error]', error);
    const wrapped = new Error(humanizeError(error));
    wrapped.raw = error;
    wrapped.code = error.code;
    wrapped.status = error.status;
    throw wrapped;
  }
  return data;
};

/* ============ Initialisation unique du client Supabase ============ */
const ready = window.CONFIG && !CONFIG.SUPABASE_URL.includes('VOTRE');
const baseUrl = ready ? (() => { try { return new URL(CONFIG.SUPABASE_URL.trim()).origin; } catch { return CONFIG.SUPABASE_URL.trim(); } })() : '';
const db = ready ? supabase.createClient(baseUrl, CONFIG.SUPABASE_ANON_KEY.trim(), {
  auth: {
    persistSession: true,
    autoRefreshToken: true,
    detectSessionInUrl: false,
    storageKey: 'carnet-recettes-auth'
  }
}) : null;

let SESSION = null, ME = null, ING = [], CAT = '';
let refreshLock = null, lastActiveAt = Date.now(), routeToken = 0;

const CATS = ['Apéro', 'Entrée', 'Plat', 'Dessert', 'Boissons'];
const refText = i => i.unit === 'piece' ? `1 ${i.name.toLowerCase()}` : `100 ${i.unit}`;
const sfx = i => !i ? '' : i.unit === 'piece' ? 'unité(s)' : i.unit;
const qtyLabel = (i, q) => i.unit === 'piece' ? `${fmt(q)} × ${i.name.toLowerCase()}` : `${fmt(q)} ${i.unit}`;

/* ============ Gestion robuste des sessions & récupération réseau ============ */
function isJwtExpiringSoon(session, bufferSec = 90) {
  if (!session?.expires_at) return false;
  return (session.expires_at - Math.floor(Date.now() / 1000)) <= bufferSec;
}

async function ensureValidSession({ requireAuth = true, forceRefresh = false } = {}) {
  if (!db) throw new Error('Configuration Supabase manquante.');
  if (refreshLock) return refreshLock;

  refreshLock = (async () => {
    try {
      const { data: sData, error: sErr } = await withTimeout(db.auth.getSession(), 10000, 'La vérification de session');
      if (sErr) console.warn('[Session getSession warning]', sErr);
      let current = sData?.session || SESSION;

      if (!current) {
        SESSION = null; ME = null; renderNav();
        if (requireAuth) {
          const err = new Error('Votre session a expiré. Reconnectez-vous pour continuer.');
          err.code = 'SESSION_EXPIRED';
          throw err;
        }
        return null;
      }

      if (forceRefresh || isJwtExpiringSoon(current, 120)) {
        const { data: rData, error: rErr } = await withTimeout(db.auth.refreshSession(), 12000, 'Le renouvellement de session');
        if (rErr || !rData?.session) {
          console.error('[Session refresh failed]', rErr);
          if (isJwtExpiringSoon(current, 0)) {
            SESSION = null; ME = null; renderNav();
            if (requireAuth) {
              const err = new Error('Votre session a expiré. Vos données sont conservées localement : reconnectez-vous.');
              err.code = 'SESSION_EXPIRED';
              throw err;
            }
            return null;
          }
        } else {
          current = rData.session;
        }
      }

      SESSION = current;
      if (SESSION?.user && (!ME || ME.id !== SESSION.user.id)) {
        await refreshProfile();
      }
      return SESSION;
    } finally {
      refreshLock = null;
    }
  })();

  return refreshLock;
}

/* Exécute une opération d'écriture avec renouvellement auto, timeout et retry unique sur erreur transitoire */
async function safeMutate(fn, label = 'La sauvegarde') {
  if (!navigator.onLine) {
    throw new Error('Vous êtes hors ligne. Vos modifications sont conservées : réessayez dès que Internet revient.');
  }
  await ensureValidSession({ requireAuth: true });
  try {
    return await withTimeout(fn(), 22000, label);
  } catch (err) {
    console.warn('[safeMutate first attempt failed]', err);
    const msg = String(err?.raw?.message || err?.message || '');
    const isAuthOrNet = err?.code === 'CLIENT_TIMEOUT' || err?.status === 401 || /jwt|token|fetch|network/i.test(msg);
    if (isAuthOrNet && navigator.onLine) {
      await ensureValidSession({ requireAuth: true, forceRefresh: true });
      return await withTimeout(fn(), 22000, label);
    }
    throw err;
  }
}

/* Protège tout bouton contre les clics multiples et garantit sa réinitialisation via finally */
async function runAction(btn, busyLabel, fn) {
  if (!btn || btn.dataset.busy === '1') return;
  const origText = btn.textContent;
  btn.dataset.busy = '1';
  btn.disabled = true;
  if (busyLabel) btn.textContent = busyLabel;
  try {
    return await fn();
  } catch (e) {
    console.error('[Action Error]', e);
    toast(humanizeError(e), true);
  } finally {
    if (document.contains(btn)) {
      btn.dataset.busy = '0';
      btn.disabled = false;
      btn.textContent = origText;
    }
  }
}

function setupLifecycleListeners() {
  const netbar = $('#netbar');
  window.addEventListener('offline', () => {
    if (!netbar) return;
    netbar.className = 'netbar';
    netbar.textContent = 'Connexion Internet perdue — vos saisies en cours restent conservées dans le navigateur.';
    netbar.hidden = false;
  });

  window.addEventListener('online', async () => {
    if (netbar) {
      netbar.className = 'netbar ok';
      netbar.textContent = 'Connexion rétablie — vérification de la session…';
      netbar.hidden = false;
      setTimeout(() => { if (navigator.onLine) netbar.hidden = true; }, 3500);
    }
    try {
      await ensureValidSession({ requireAuth: false, forceRefresh: true });
      renderNav();
    } catch (e) {
      console.warn('[Online recovery]', e);
    }
  });

  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'hidden') {
      lastActiveAt = Date.now();
      return;
    }
    const idleMs = Date.now() - lastActiveAt;
    lastActiveAt = Date.now();
    if (idleMs > 90 * 1000 && SESSION && navigator.onLine) {
      try {
        await ensureValidSession({ requireAuth: false, forceRefresh: idleMs > 15 * 60 * 1000 });
        renderNav();
      } catch (e) {
        console.warn('[Visibility recovery]', e);
      }
    }
  });
}

/* Chargement paginé de tous les ingrédients (> 1 000) avec timeout */
const loadIng = async () => {
  await ensureValidSession({ requireAuth: false });
  let all = [], from = 0, step = 1000;
  while (true) {
    const rows = ok(await withTimeout(
      db.from('ingredients').select('*').order('name').range(from, from + step - 1),
      15000,
      'Le chargement des ingrédients'
    ));
    all = all.concat(rows || []);
    if (!rows || rows.length < step) break;
    from += step;
  }
  ING = all;
};

function totals(r) {
  const t = { kcal: 0, protein: 0, carbs: 0, fat: 0 };
  (r.recipe_ingredients || []).forEach(ri => {
    const i = ri.ingredients; if (!i) return;
    const f = i.unit === 'piece' ? ri.quantity : ri.quantity / 100;
    for (const k in t) t[k] += (i[k] || 0) * f;
  });
  return t;
}

function avatarHtml(profile, cls = '') {
  const name = profile?.pseudo || '?';
  const letter = esc(name.charAt(0).toUpperCase());
  return `<div class="av ${cls}">${profile?.avatar_url ? `<img src="${esc(profile.avatar_url)}" alt="" loading="lazy">` : letter}</div>`;
}

async function sha256Hex(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}

async function refreshProfile() {
  if (!SESSION?.user) { ME = null; return; }
  const { data } = await withTimeout(
    db.from('profiles').select('*').eq('id', SESSION.user.id).maybeSingle(),
    10000,
    'Le chargement du profil'
  );
  ME = data || null;
}

function renderNav() {
  const [p] = location.hash.slice(2).split('/');
  const cur = p || '';
  if (SESSION && ME) {
    $('#nav').innerHTML = `
      <a href="#/" class="${cur === '' ? 'on' : ''}">Accueil</a>
      <a href="#/mes-recettes" class="${cur === 'mes-recettes' ? 'on' : ''}">Mes recettes</a>
      <a href="#/calendrier" class="${cur === 'calendrier' ? 'on' : ''}">Calendrier</a>
      <a href="#/recherche" class="${cur === 'recherche' ? 'on' : ''}">Recherche</a>
      <a href="#/ingredients" class="${cur === 'ingredients' ? 'on' : ''}">Ingrédients</a>
      <a href="#/profil" class="${cur === 'profil' && !location.hash.split('/')[2] ? 'on' : ''}">Mon profil</a>
      <a class="add" href="#/nouvelle">+ Nouvelle recette</a>`;
  } else {
    $('#nav').innerHTML = `

/* ============ Fenêtres modales génériques ============ */
function openModal(html, onReady) {
  const prevFocus = document.activeElement, prevOverflow = document.body.style.overflow;
  const el = document.createElement('div'); el.className = 'mo';
  el.innerHTML = `<div class="md" role="dialog" aria-modal="true">${html}</div>`;
  const close = () => {
    document.removeEventListener('keydown', onKey);
    document.body.style.overflow = prevOverflow;
    el.remove();
    if (prevFocus && document.contains(prevFocus)) prevFocus.focus();
  };
  const onKey = e => { if (e.key === 'Escape') close(); };
  el.onclick = e => { if (e.target === el) close(); };
  document.body.append(el);
  document.body.style.overflow = 'hidden';
  document.addEventListener('keydown', onKey);
  if (onReady) onReady(el, close);
  return close;
}

function confirmDialog({ title, name, text, warn, confirmLabel = 'Supprimer', extraHtml = '', onConfirm }) {
  openModal(`
    <h2>${esc(title)}</h2>
    ${name ? `<div class="nm">${esc(name)}</div>` : ''}
    <p>${esc(text)}</p>
    ${warn ? `<p class="warn">${esc(warn)}</p>` : ''}
    ${extraHtml}
    <div class="err" id="mderr" role="alert" hidden></div>
    <div class="mb">
      <button class="btn ghost" id="mdno" type="button">Annuler</button>
      <button class="btn danger" id="mdyes" type="button">${esc(confirmLabel)}</button>
    </div>`, (el, close) => {
    const no = el.querySelector('#mdno'), yes = el.querySelector('#mdyes'), err = el.querySelector('#mderr');
    let busy = false;
    no.onclick = () => { if (!busy) close(); };
    yes.onclick = async () => {
      if (busy) return;
      busy = true; yes.disabled = no.disabled = true; yes.textContent = 'Traitement…'; err.hidden = true;
      try {
        await onConfirm(el);
        close();
      } catch (e) {
        console.error('[Confirm Dialog Error]', e);
        err.textContent = humanizeError(e);
        err.hidden = false;
      } finally {
        if (document.contains(yes)) {
          busy = false;
          yes.disabled = no.disabled = false;
          yes.textContent = confirmLabel;
        }
      }
    };
    no.focus();
  });
}

/* ============ Routeur ============ */
async function route() {
  const token = ++routeToken;
  renderNav();
  if (!ready) { app.innerHTML = '<div class="err">Renseignez vos clés Supabase dans <b>config.js</b>.</div>'; return; }
  const [p, a] = location.hash.slice(2).split('/');
  app.innerHTML = '<p class="muted">Chargement…</p>';
  try {
    await ensureValidSession({ requireAuth: false });
    if (token !== routeToken) return;
    if (p === 'connexion') await viewLogin();
    else if (p === 'inscription') await viewRegister();
    else if (p === 'recherche') await viewSearch();
    else if (p === 'profil') await viewProfile(a || ME?.id);
    else if (p === 'mes-recettes') await viewMyRecipes();
    else if (p === 'ingredients') await viewIng();
    else if (p === 'calendrier') await viewCalendar();
    else if (p === 'nouvelle') await viewForm();
    else if (p === 'modifier') await viewForm(a);
    else if (p === 'recette') await viewRecipe(a);
    else await viewDashboard();
  } catch (e) {
    if (token !== routeToken) return;
    console.error('[Route Error]', e);
    app.innerHTML = `<div class="err">${esc(humanizeError(e))}</div>
      <button class="btn ghost" type="button" onclick="route()">Réessayer</button>`;
  }
  window.scrollTo(0, 0);
}

async function boot() {
  setupLifecycleListeners();
  if (db) {
    try {
      const { data } = await withTimeout(db.auth.getSession(), 10000, 'L’initialisation');
      SESSION = data?.session || null;
      await refreshProfile();
    } catch (e) {
      console.warn('[Boot session warning]', e);
    }
    db.auth.onAuthStateChange(async (event, session) => {
      SESSION = session;
      if (event === 'SIGNED_OUT') {
        ME = null;
      } else if (session?.user && (!ME || ME.id !== session.user.id)) {
        try { await refreshProfile(); } catch (_) {}
      }
      renderNav();
    });
  }
  addEventListener('hashchange', route);
  route();
}

/* ============ Authentification (Pseudo + Mot de passe sans mail) ============ */
function validatePseudoClient(raw) {
  const clean = String(raw ?? '').trim();
  if (clean.length < 3 || clean.length > 24) return 'Le pseudo doit contenir entre 3 et 24 caractères.';
  if (!/^[a-zA-ZäëïöüÿÄËÏÖÜŸ0-9._-]+$/.test(clean)) return 'Le pseudo ne peut contenir que des lettres (y compris avec tréma), chiffres, points, tirets ou underscores (sans espaces).';
  return null;
}

async function viewRegister() {
  if (SESSION && ME) { location.hash = '#/'; return; }
  app.innerHTML = `<div class="authbox">

      <label for="pseudo">Pseudo *</label>

      <label for="pwd">Mot de passe *</label>
      <input id="pwd" type="password" autocomplete="new-password" placeholder="6 caractères minimum" required>
      <label for="pwd2">Confirmation du mot de passe *</label>
      <input id="pwd2" type="password" autocomplete="new-password" placeholder="Répétez le mot de passe" required>
      <div class="actions" style="margin:20px 0 0">
        <button class="btn pri" id="sub" type="submit" style="width:100%">Créer mon compte</button>
      </div>

  </div>`;

  $('#regf').onsubmit = async e => {
    e.preventDefault();
    const errBox = $('#aerr'), btn = $('#sub');
    if (btn.disabled) return;
    errBox.hidden = true;
    const pseudo = $('#pseudo').value.trim();
    const pwd = $('#pwd').value;
    const pwd2 = $('#pwd2').value;

    const pErr = validatePseudoClient(pseudo);
    if (pErr) { errBox.textContent = pErr; errBox.hidden = false; return; }
    if (pwd.length < 6) { errBox.textContent = 'Le mot de passe est trop court (6 caractères minimum).'; errBox.hidden = false; return; }
    if (pwd !== pwd2) { errBox.textContent = 'La confirmation du mot de passe ne correspond pas.'; errBox.hidden = false; return; }

    btn.disabled = true; btn.textContent = 'Création du compte…';
    try {
      const existing = await withTimeout(db.rpc('resolve_login_id', { p_pseudo: pseudo }), 12000, 'La vérification du pseudo');
      if (existing.data) throw new Error('Ce pseudo est déjà utilisé.');

      const loginId = `u_${crypto.randomUUID()}@carnet.invalid`;
      const { data, error } = await withTimeout(db.auth.signUp({
        email: loginId,
        password: pwd,
        options: { data: { pseudo } }
      }), 15000, 'L’inscription');

      if (error) {
        const msg = error.message || '';
        if (msg.includes('PSEUDO_TAKEN')) throw new Error('Ce pseudo est déjà utilisé.');
        if (msg.includes('PSEUDO_INVALID')) throw new Error('Pseudo invalide (3 à 24 caractères : lettres, chiffres, ., _, -).');
        if (msg.toLowerCase().includes('password')) throw new Error('Mot de passe trop court ou non sécurisé.');
        throw new Error(humanizeError(error));
      }

      if (!data.session) {
        const si = await withTimeout(db.auth.signInWithPassword({ email: loginId, password: pwd }), 15000, 'La connexion');
        if (si.error) throw new Error('Compte créé, veuillez vous connecter.');
        SESSION = si.data.session;
      } else {
        SESSION = data.session;
      }

      await refreshProfile();
      renderNav();
      toast(`Bienvenue ${ME?.pseudo || pseudo} !`);
      location.hash = '#/';
    } catch (ex) {
      errBox.textContent = humanizeError(ex);
      errBox.hidden = false;
    } finally {
      if (document.contains(btn)) {
        btn.disabled = false;
        btn.textContent = 'Créer mon compte';
      }
    }
  };
}

/* ============ Mes recettes (Bibliothèque personnelle) ============ */
let MY_Q = '', MY_FILTER = 'all';
async function viewMyRecipes() {
  if (!SESSION || !ME) { location.hash = '#/connexion'; return; }
  const recipes = ok(await withTimeout(db.from('recipes')
    .select('*, recipe_ingredients(quantity, ingredients(*))')
    .eq('owner_id', ME.id)
    .order('created_at', { ascending: false }), 15000));

  const hasNone = recipes.some(r => !r.category);
  if (CAT === '__none' && !hasNone) CAT = '';
  const pills = [['', 'Toutes catégories'], ...CATS.map(c => [c, c]), ...(hasNone ? [['__none', 'À classer']] : [])];
  const filters = [
    ['all', `Toutes (${recipes.length})`],
    ['original', `Mes créations (${recipes.filter(r => !r.source_recipe_id && !r.source_author_pseudo).length})`],
    ['copied', `Enregistrées (${recipes.filter(r => r.source_recipe_id || r.source_author_pseudo).length})`],
    ['public', `Publiques (${recipes.filter(r => r.visibility === 'public').length})`],
    ['private', `Privées (${recipes.filter(r => r.visibility === 'private').length})`]
  ];

  app.innerHTML = `<section class="find">
    <h1>Ma bibliothèque de recettes</h1>
    <div class="searchrow">
      <input id="q" value="${esc(MY_Q)}" placeholder="Rechercher par nom ou ingrédients : poulet, riz, crème…" aria-label="Rechercher dans mes recettes">
      <button class="btn ghost" id="all" type="button">Réinitialiser</button>
    </div>
    <div class="tabs" id="mfilters">${filters.map(([k, l]) => `<button class="tab ${MY_FILTER === k ? 'on' : ''}" data-f="${k}" type="button">${esc(l)}</button>`).join('')}</div>
    <div class="cats" id="cats">${pills.map(([v, l]) => `<button class="pill ${CAT === v ? 'on' : ''}" data-c="${esc(v)}" type="button">${esc(l)}</button>`).join('')}</div>
  </section><div id="grid" class="grid"></div>`;

  const draw = () => {
    document.querySelectorAll('#mfilters .tab').forEach(b => b.classList.toggle('on', b.dataset.f === MY_FILTER));
    document.querySelectorAll('#cats .pill').forEach(b => b.classList.toggle('on', b.dataset.c === CAT));
    const terms = MY_Q.split(',').map(norm).filter(Boolean);
    const hit = (n, t) => n.includes(t) || (n.length > 2 && t.includes(n));
    const inTitle = (title, t) => t.split(/\s+/).every(w => title.includes(w));

    let list = recipes.filter(r => {
      if (MY_FILTER === 'original' && (r.source_recipe_id || r.source_author_pseudo)) return false;
      if (MY_FILTER === 'copied' && !r.source_recipe_id && !r.source_author_pseudo) return false;
      if (MY_FILTER === 'public' && r.visibility !== 'public') return false;
      if (MY_FILTER === 'private' && r.visibility !== 'private') return false;
      if (CAT !== '' && (CAT === '__none' ? !!r.category : r.category !== CAT)) return false;
      return true;
    }).map(r => {
      const names = (r.recipe_ingredients || []).map(ri => ({ raw: ri.ingredients?.name || '', n: norm(ri.ingredients?.name || '') }));
      const missing = terms.length ? names.filter(x => !terms.some(t => hit(x.n, t))).map(x => x.raw) : [];
      const title = norm(r.title);
      return { r, missing, score: names.length - missing.length, total: names.length, tHit: terms.some(t => inTitle(title, t)), tFull: terms.length > 0 && inTitle(title, terms.join(' ')) };
    });

    if (terms.length) {
      list = list.filter(x => x.score > 0 || x.tHit)
        .sort((a, b) => b.tFull - a.tFull || b.score - a.score || b.tHit - a.tHit || a.missing.length - b.missing.length);
    }

    $('#grid').innerHTML = list.length ? list.map(({ r, missing, score, total }) => {
      const card = recipeCardHtml(r, { showAuthor: false, showVis: true, showCopyBadge: true });
      if (terms.length && score > 0) {
        const info = missing.length ? `<div class="miss">${score}/${total} ingrédients. Il manque : ${missing.map(esc).join(', ')}</div>` : '<div class="ok">Vous avez tout !</div>';
        return card.replace('</div>\n  </div>', `${info}</div></div>`);
      }
      return card;
    }).join('') : `<div class="empty" style="grid-column:1/-1">Aucune recette ne correspond à ces critères.</div>`;
  };

  $('#q').oninput = e => { MY_Q = e.target.value; draw(); };
  $('#mfilters').onclick = e => { const b = e.target.closest('.tab'); if (b) { MY_FILTER = b.dataset.f; draw(); } };
  $('#cats').onclick = e => { const b = e.target.closest('.pill'); if (b) { CAT = b.dataset.c; draw(); } };
  $('#all').onclick = () => { MY_Q = ''; MY_FILTER = 'all'; CAT = ''; $('#q').value = ''; draw(); };
  draw();
}

      <button class="tab ${SRCH_TAB === 'users' ? 'on' : ''}" data-t="users" type="button">Utilisateurs</button>

    <div id="scontrols"></div>
  </section>
  <div id="sresults"></div>
  <div class="more" id="smore" hidden><button class="btn ghost" id="morebtn" type="button">Charger plus</button></div>`;

  const renderControls = () => {
    if (SRCH_TAB === 'recipes') {
      $('#scontrols').innerHTML = `
        <div class="searchrow" style="margin-bottom:10px">
          <input id="sq" value="${esc(SRCH_Q)}" placeholder="Nom, ingrédient, description, créateur…" aria-label="Rechercher une recette">
          <select id="ssort" style="max-width:200px" aria-label="Trier par">
            <option value="recent" ${SRCH_SORT === 'recent' ? 'selected' : ''}>Plus récentes</option>
            <option value="oldest" ${SRCH_SORT === 'oldest' ? 'selected' : ''}>Plus anciennes</option>
            <option value="alpha" ${SRCH_SORT === 'alpha' ? 'selected' : ''}>Alphabétique (A-Z)</option>
          </select>
        </div>
        <div class="two">
          <select id="scat" aria-label="Catégorie">
            <option value="">Toutes les catégories</option>
            ${CATS.map(c => `<option ${SRCH_CAT === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}
          </select>
          <input id="sdish" value="${esc(SRCH_DISH)}" placeholder="Type de plat (ex. Végétarien, Rapide…)" aria-label="Type de plat">
        </div>`;
    } else {
      $('#scontrols').innerHTML = `
        <div class="searchrow">
          <input id="sq" value="${esc(SRCH_Q)}" placeholder="Rechercher un utilisateur par son pseudo…" aria-label="Rechercher un utilisateur">
        </div>`;
    }

    const runDebounced = debounce(() => runSearch(true), 300);
    $('#sq').oninput = e => { SRCH_Q = e.target.value; runDebounced(); };
    if (SRCH_TAB === 'recipes') {
      $('#ssort').onchange = e => { SRCH_SORT = e.target.value; runSearch(true); };
      $('#scat').onchange = e => { SRCH_CAT = e.target.value; runSearch(true); };
      $('#sdish').oninput = e => { SRCH_DISH = e.target.value; runDebounced(); };
    }
  };

  const runSearch = async (reset = true) => {
    if (loading) return;
    loading = true;
    if (reset) {
      offset = 0;
      $('#sresults').innerHTML = '<p class="muted">Recherche en cours…</p>';
      $('#smore').hidden = true;
    } else {
      $('#morebtn').disabled = true;
      $('#morebtn').textContent = 'Chargement…';
    }

    try {
      if (SRCH_TAB === 'recipes') {
        const rows = ok(await withTimeout(db.rpc('search_public_recipes', {
          p_query: SRCH_Q,
          p_category: SRCH_CAT,
          p_dish_type: SRCH_DISH,
          p_sort: SRCH_SORT,
          p_limit: PAGE_SIZE,
          p_offset: offset
        }), 15000));
        hasMore = rows.length === PAGE_SIZE;
        offset += rows.length;
        const html = rows.map(r => recipeCardHtml(r, { showAuthor: true })).join('');
        if (reset) {
          $('#sresults').innerHTML = rows.length
            ? `<div class="grid" id="rgrid">${html}</div>`
            : `<div class="empty">Aucune recette publique ne correspond à votre recherche.</div>`;
        } else {
          $('#rgrid').insertAdjacentHTML('beforeend', html);
        }
      } else {
        let q = db.from('profiles').select('id, pseudo, bio, avatar_url, created_at').order('pseudo', { ascending: true }).range(offset, offset + PAGE_SIZE - 1);
        const term = norm(SRCH_Q);
        if (term) q = q.ilike('pseudo_norm', `%${term}%`);
        const users = ok(await withTimeout(q, 15000));
        hasMore = users.length === PAGE_SIZE;
        offset += users.length;

        const userIds = users.map(u => u.id);
        let pubCounts = {}, folCounts = {};
        if (userIds.length) {
          const [pRes, fRes] = await withTimeout(Promise.all([
            db.from('recipes').select('owner_id').eq('visibility', 'public').in('owner_id', userIds),
            db.from('follows').select('following_id').in('following_id', userIds)
          ]), 12000);
          (pRes.data || []).forEach(x => { pubCounts[x.owner_id] = (pubCounts[x.owner_id] || 0) + 1; });
          (fRes.data || []).forEach(x => { folCounts[x.following_id] = (folCounts[x.following_id] || 0) + 1; });
        }

        const html = users.map(u => {
          const isMe = ME && u.id === ME.id;
          const isFol = myFollowing.has(u.id);
          const pc = pubCounts[u.id] || 0, fc = folCounts[u.id] || 0;
          return `<div class="ucard" data-uid="${u.id}">
            <a href="#/profil/${u.id}">${avatarHtml(u, 'sm')}</a>
            <div class="uinfo">
              <h3><a href="#/profil/${u.id}">@${esc(u.pseudo)}</a></h3>
              <p>${esc(u.bio || 'Aucune description.')}</p>
              <div class="meta"><span>${pc} recette${pc > 1 ? 's' : ''} publique${pc > 1 ? 's' : ''}</span><span>•</span><span class="fcnt">${fc} abonné${fc > 1 ? 's' : ''}</span></div>
            </div>
            <div class="uactions">
              <a class="btn ghost sm" href="#/profil/${u.id}">Profil</a>
              ${!isMe ? `<button class="btn sm ${isFol ? 'ghost' : 'pri'}" data-follow="${u.id}" type="button">${isFol ? 'Ne plus suivre' : 'Suivre'}</button>` : ''}
            </div>
          </div>`;
        }).join('');

        if (reset) {
          $('#sresults').innerHTML = users.length
            ? `<div style="display:grid;gap:14px" id="ulist">${html}</div>`
            : `<div class="empty">Aucun utilisateur trouvé pour « ${esc(SRCH_Q)} ».</div>`;
        } else {
          $('#ulist').insertAdjacentHTML('beforeend', html);
        }
      }
      $('#smore').hidden = !hasMore;
    } catch (e) {
      toast(humanizeError(e), true);
      if (reset) $('#sresults').innerHTML = `<div class="err">${esc(humanizeError(e))}</div>`;
    } finally {
      loading = false;
      if ($('#morebtn')) {
        $('#morebtn').disabled = false;
        $('#morebtn').textContent = 'Charger plus';
      }
    }
  };

  $('#stabs').onclick = e => {
    const b = e.target.closest('.tab'); if (!b || b.dataset.t === SRCH_TAB) return;
    SRCH_TAB = b.dataset.t;
    document.querySelectorAll('#stabs .tab').forEach(t => t.classList.toggle('on', t.dataset.t === SRCH_TAB));
    renderControls();
    runSearch(true);
  };

  $('#sresults').onclick = async e => {
    const btn = e.target.closest('[data-follow]'); if (!btn) return;
    if (!SESSION || !ME) { location.hash = '#/connexion'; return; }
    const targetId = btn.dataset.follow;
    if (targetId === ME.id) return;
    await runAction(btn, '…', async () => {
      const wasFollowing = myFollowing.has(targetId);
      if (wasFollowing) {
        await safeMutate(async () => ok(await db.from('follows').delete().eq('follower_id', ME.id).eq('following_id', targetId)));
        myFollowing.delete(targetId);
        toast('Utilisateur non suivi');
      } else {
        await safeMutate(async () => ok(await db.from('follows').insert({ follower_id: ME.id, following_id: targetId })));
        myFollowing.add(targetId);
        toast('Utilisateur suivi');
      }
      const card = btn.closest('.ucard');
      const fSpan = card.querySelector('.fcnt');
      const curNum = parseInt(fSpan.textContent, 10) || 0;
      const nextNum = Math.max(0, curNum + (wasFollowing ? -1 : 1));
      fSpan.textContent = `${nextNum} abonné${nextNum > 1 ? 's' : ''}`;
      btn.className = `btn sm ${wasFollowing ? 'pri' : 'ghost'}`;
      btn.textContent = wasFollowing ? 'Suivre' : 'Ne plus suivre';
    });
  };

  $('#morebtn').onclick = () => runSearch(false);
  renderControls();
  await runSearch(true);
}

/* ============ Profil utilisateur (Personnel & Public) ============ */
let PROF_TAB = 'published';
async function viewProfile(targetId) {
  if (!targetId) { location.hash = '#/connexion'; return; }
  const profile = ok(await withTimeout(db.from('profiles').select('*').eq('id', targetId).maybeSingle(), 12000));
  if (!profile) {
    app.innerHTML = `<div class="empty">Ce profil utilisateur n’existe pas ou a été supprimé.</div>`;
    return;
  }

  const isOwn = ME && profile.id === ME.id;
  const [followersRes, followingRes, pubRes, savedRes, isFollowingRes] = await withTimeout(Promise.all([
    db.from('follows').select('follower_id', { count: 'exact', head: true }).eq('following_id', profile.id),
    db.from('follows').select('following_id', { count: 'exact', head: true }).eq('follower_id', profile.id),
    db.from('recipes')
      .select('*, recipe_ingredients(quantity, ingredients(*))')
      .eq('owner_id', profile.id)
      .eq('visibility', 'public')
      .order('created_at', { ascending: false }),
    isOwn
      ? db.from('recipes')
          .select('*, recipe_ingredients(quantity, ingredients(*))')
          .eq('owner_id', profile.id)
          .or('source_recipe_id.not.is.null,source_author_pseudo.not.is.null')
          .order('created_at', { ascending: false })
      : Promise.resolve({ data: [] }),
    (!isOwn && ME)
      ? db.from('follows').select('follower_id').eq('follower_id', ME.id).eq('following_id', profile.id).maybeSingle()
      : Promise.resolve({ data: null })
  ]), 15000);

  let followersCount = followersRes.count || 0;
  const followingCount = followingRes.count || 0;
  const pubRecipes = pubRes.data || [];
  const savedRecipes = savedRes.data || [];
  let isFollowing = !!isFollowingRes.data;

  app.innerHTML = `
    <div class="phead">
      ${avatarHtml(profile)}
      <div class="pinfo">
        <h1 style="font-size:1.75rem">@${esc(profile.pseudo)}</h1>
        ${profile.bio ? `<p style="margin:6px 0 0;color:var(--mute)">${esc(profile.bio)}</p>` : `<p class="muted" style="margin:6px 0 0;font-size:.92rem">${isOwn ? 'Aucune biographie renseignée.' : ''}</p>`}
        <div class="pstats">
          <div class="pstat" style="cursor:default"><b>${pubRecipes.length}</b><span>Recette${pubRecipes.length > 1 ? 's' : ''} publiée${pubRecipes.length > 1 ? 's' : ''}</span></div>
          <button class="pstat" id="btnFollowers" type="button"><b id="fcount">${followersCount}</b><span>Abonné${followersCount > 1 ? 's' : ''}</span></button>
          <button class="pstat" id="btnFollowing" type="button"><b>${followingCount}</b><span>Abonnement${followingCount > 1 ? 's' : ''}</span></button>
        </div>
        <div class="actions" style="margin:0">
          ${isOwn
            ? `<button class="btn ghost sm" id="editProf" type="button">Modifier mon profil</button>
               <button class="btn del sm" id="logoutBtn" type="button">Déconnexion</button>
               <button class="btn ghost sm" id="delAccBtn" type="button" style="color:var(--accent)">Supprimer le compte</button>`
            : `<button class="btn ${isFollowing ? 'ghost' : 'pri'}" id="followBtn" type="button">${isFollowing ? 'Ne plus suivre' : 'Suivre'}</button>`}
        </div>
      </div>
    </div>
    ${isOwn ? `
      <div class="tabs" id="ptabs" style="margin-bottom:18px">
        <button class="tab ${PROF_TAB === 'published' ? 'on' : ''}" data-pt="published" type="button">Mes recettes publiées (${pubRecipes.length})</button>
        <button class="tab ${PROF_TAB === 'saved' ? 'on' : ''}" data-pt="saved" type="button">Mes recettes enregistrées (${savedRecipes.length})</button>
      </div>` : `<h2 style="margin-bottom:14px">Recettes publiques de @${esc(profile.pseudo)}</h2>`}
    <div id="pgrid"></div>`;

  const renderGrid = () => {
    if (!isOwn || PROF_TAB === 'published') {
      $('#pgrid').innerHTML = pubRecipes.length
        ? `<div class="grid">${pubRecipes.map(r => recipeCardHtml(r, { showAuthor: false, showVis: isOwn })).join('')}</div>`
        : `<div class="empty">${isOwn ? 'Vous n’avez pas encore publié de recette publique.' : 'Cet utilisateur n’a pas encore publié de recette.'}</div>`;
    } else {
      $('#pgrid').innerHTML = savedRecipes.length
        ? `<div class="grid">${savedRecipes.map(r => recipeCardHtml(r, { showAuthor: false, showVis: true, showCopyBadge: true })).join('')}</div>`
        : `<div class="empty">Aucune recette enregistrée depuis d’autres utilisateurs. Explorez l’onglet <a href="#/recherche" style="color:var(--accent);font-weight:700">Recherche</a> pour en ajouter !</div>`;
    }
  };
  renderGrid();

  if (isOwn) {
    $('#ptabs').onclick = e => {
      const b = e.target.closest('.tab'); if (!b) return;
      PROF_TAB = b.dataset.pt;
      document.querySelectorAll('#ptabs .tab').forEach(t => t.classList.toggle('on', t.dataset.pt === PROF_TAB));
      renderGrid();
    };
    $('#logoutBtn').onclick = () => runAction($('#logoutBtn'), 'Déconnexion…', async () => {
      await db.auth.signOut();
      SESSION = null; ME = null;
      renderNav();
      toast('Vous êtes déconnecté');
      location.hash = '#/connexion';
    });
    $('#editProf').onclick = () => openEditProfileModal(profile);
    $('#delAccBtn').onclick = () => confirmDialog({
      title: 'Supprimer définitivement votre compte ?',
      name: `@${profile.pseudo}`,
      text: 'Votre profil, vos abonnements, vos notes personnelles et vos recettes privées seront supprimés définitivement.',
      warn: 'Par défaut, vos recettes publiques déjà partagées sont anonymisées (« Utilisateur supprimé ») afin de préserver l’intégrité de la communauté.',
      confirmLabel: 'Supprimer mon compte',
      extraHtml: `<label style="display:flex;align-items:center;gap:10px;margin-top:14px;font-weight:500;cursor:pointer">
        <input type="checkbox" id="delPubChk" style="width:18px;height:18px"> Supprimer également toutes mes recettes publiques
      </label>`,
      onConfirm: async el => {
        const delPub = el.querySelector('#delPubChk').checked;
        await safeMutate(async () => ok(await db.rpc('delete_my_account', { p_delete_public_recipes: delPub })));
        await db.auth.signOut();
        SESSION = null; ME = null;
        renderNav();
        toast('Votre compte a été supprimé');
        location.hash = '#/';
      }
    });
  } else {
    $('#followBtn').onclick = () => runAction($('#followBtn'), 'Traitement…', async () => {
      if (!SESSION || !ME) { location.hash = '#/connexion'; return; }
      const btn = $('#followBtn');
      if (isFollowing) {
        await safeMutate(async () => ok(await db.from('follows').delete().eq('follower_id', ME.id).eq('following_id', profile.id)));
        isFollowing = false;
        followersCount = Math.max(0, followersCount - 1);
        toast('Utilisateur non suivi');
      } else {
        await safeMutate(async () => ok(await db.from('follows').insert({ follower_id: ME.id, following_id: profile.id })));
        isFollowing = true;
        followersCount += 1;
        toast('Utilisateur suivi');
      }
      btn.className = `btn ${isFollowing ? 'ghost' : 'pri'}`;
      btn.textContent = isFollowing ? 'Ne plus suivre' : 'Suivre';
      $('#fcount').textContent = followersCount;
    });
  }

  $('#btnFollowers').onclick = () => openFollowListModal(profile.id, 'followers');
  $('#btnFollowing').onclick = () => openFollowListModal(profile.id, 'following');
}

function openEditProfileModal(profile) {
  let avatarFile = null;
  openModal(`
    <h2>Modifier mon profil</h2>
    <div id="perr" class="err" hidden></div>
    <form class="form" id="pform">
      <label>Photo de profil</label>
      <div style="display:flex;align-items:center;gap:14px">
        <div id="avprev">${avatarHtml(profile)}</div>
        <input type="file" id="avfile" accept="image/*">
      </div>
      <label for="epseudo">Pseudo *</label>
      <input id="epseudo" value="${esc(profile.pseudo)}" maxlength="24" required>
      <label for="ebio">Description / Biographie (max. 300 caractères)</label>
      <textarea id="ebio" rows="3" maxlength="300" placeholder="Parlez de votre cuisine…">${esc(profile.bio || '')}</textarea>
      <div class="mb">
        <button class="btn ghost" id="pcancel" type="button">Annuler</button>
        <button class="btn pri" id="psave" type="submit">Enregistrer</button>
      </div>
    </form>`, (el, close) => {
    el.querySelector('#pcancel').onclick = close;
    el.querySelector('#avfile').onchange = e => {
      avatarFile = e.target.files[0] || null;
      if (avatarFile) {
        el.querySelector('#avprev').innerHTML = `<div class="av"><img src="${URL.createObjectURL(avatarFile)}" alt=""></div>`;
      }
    };
    el.querySelector('#pform').onsubmit = async e => {
      e.preventDefault();
      const errBox = el.querySelector('#perr'), btn = el.querySelector('#psave');
      if (btn.disabled) return;
      errBox.hidden = true;
      const newPseudo = el.querySelector('#epseudo').value.trim();
      const newBio = el.querySelector('#ebio').value.trim();
      const pErr = validatePseudoClient(newPseudo);
      if (pErr) { errBox.textContent = pErr; errBox.hidden = false; return; }

      btn.disabled = true; btn.textContent = 'Enregistrement…';
      try {
        await safeMutate(async () => {
          if (norm(newPseudo) !== profile.pseudo_norm || newPseudo !== profile.pseudo) {
            const { error: pUpdErr } = await db.rpc('update_my_pseudo', { p_new_pseudo: newPseudo });
            if (pUpdErr) {
              if (pUpdErr.message?.includes('PSEUDO_TAKEN')) throw new Error('Ce pseudo est déjà utilisé.');
              throw new Error(humanizeError(pUpdErr));
            }
          }

          let { avatar_url, avatar_path } = profile, oldAvatar = null;
          if (avatarFile) {
            const path = `${profile.id}/${crypto.randomUUID()}.jpg`;
            const up = await db.storage.from('avatars').upload(path, await resize(avatarFile, 600), { contentType: 'image/jpeg' });
            if (up.error) throw new Error('Envoi de la photo impossible : ' + up.error.message);
            oldAvatar = profile.avatar_path;
            avatar_path = path;
            avatar_url = db.storage.from('avatars').getPublicUrl(path).data.publicUrl;
          }

          ok(await db.from('profiles').update({ bio: newBio, avatar_url, avatar_path, updated_at: new Date().toISOString() }).eq('id', profile.id));
          if (oldAvatar) await db.storage.from('avatars').remove([oldAvatar]).catch(() => {});
        }, 'La mise à jour du profil');

        await refreshProfile();
        toast('Profil mis à jour');
        close();
        viewProfile(profile.id);
      } catch (ex) {
        errBox.textContent = humanizeError(ex);
        errBox.hidden = false;
      } finally {
        if (document.contains(btn)) {
          btn.disabled = false;
          btn.textContent = 'Enregistrer';
        }
      }
    };
  });
}

async function openFollowListModal(userId, mode) {
  const title = mode === 'followers' ? 'Abonnés' : 'Abonnements';
  openModal(`<h2>${title}</h2><div id="flist"><p class="muted">Chargement…</p></div><div class="mb"><button class="btn ghost" id="fclose" type="button">Fermer</button></div>`, async (el, close) => {
    el.querySelector('#fclose').onclick = close;
    try {
      const col = mode === 'followers' ? 'follower_id' : 'following_id';
      const filterCol = mode === 'followers' ? 'following_id' : 'follower_id';
      const rows = ok(await withTimeout(db.from('follows').select(`${col}`).eq(filterCol, userId).order('created_at', { ascending: false }), 12000));
      const ids = rows.map(r => r[col]);
      if (!ids.length) {
        el.querySelector('#flist').innerHTML = `<p class="muted">Aucun ${mode === 'followers' ? 'abonné' : 'abonnement'} pour le moment.</p>`;
        return;
      }
      const profiles = ok(await withTimeout(db.from('profiles').select('id, pseudo, bio, avatar_url').in('id', ids), 12000));
      el.querySelector('#flist').innerHTML = profiles.map(p => `
        <div class="urow">
          <a href="#/profil/${p.id}" class="flnk" style="display:flex;align-items:center;gap:10px;min-width:0">
            ${avatarHtml(p, 'sm')}
            <div style="min-width:0">
              <b>@${esc(p.pseudo)}</b>
              ${p.bio ? `<div class="muted" style="font-size:.84rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.bio)}</div>` : ''}
            </div>
          </a>
          <a class="btn ghost sm flnk" href="#/profil/${p.id}">Voir</a>
        </div>`).join('');
      el.querySelectorAll('.flnk').forEach(a => a.onclick = () => close());
    } catch (ex) {
      el.querySelector('#flist').innerHTML = `<div class="err">${esc(humanizeError(ex))}</div>`;
    }
  });
}

/* ============ Fiche recette détaillée ============ */

async function viewRecipe(id) {

    .select('*, profiles:owner_id(id, pseudo, avatar_url), recipe_ingredients(quantity, position, ingredients(*))')
    .eq('id', id)
    .maybeSingle(), 15000);

    app.innerHTML = `<div class="empty">Cette recette est privée ou n’existe plus.</div>`;
    return;

  let existingCopyId = null;

  if (isOwner) {
    const nRes = await withTimeout(db.from('recipe_private_notes').select('notes').eq('recipe_id', r.id).maybeSingle(), 10000);

    const cRes = await withTimeout(db.from('recipes').select('id').eq('owner_id', ME.id).eq('source_recipe_id', r.id).maybeSingle(), 10000);

  }

  const ris = (r.recipe_ingredients || []).sort((a, b) => a.position - b.position);
  const t = totals(r);
  const prepText = stepsToText(r.steps);
  const author = r.profiles;

  app.innerHTML = `
    <div class="hero">${r.cover_url ? `<img src="${esc(r.cover_url)}" alt="">` : '🍽'}</div>

        : `<span class="muted">Par Utilisateur supprimé</span>`}
    </div>
    ${r.source_author_pseudo ? `
      <div class="prov">
        <span>Recette enregistrée depuis le profil de ${r.source_author_id ? `<a href="#/profil/${r.source_author_id}" style="font-weight:700;color:var(--accent)">@${esc(r.source_author_pseudo)}</a>` : `<b>@${esc(r.source_author_pseudo)}</b>`} (copie indépendante)</span>
      </div>` : ''}
    <div class="chips">
      ${isOwner ? `<span class="chip ${r.visibility === 'public' ? 'pub' : 'priv'}">${r.visibility === 'public' ? 'Publique' : 'Privée'}</span>` : ''}
      ${r.category ? `<span class="chip">${esc(r.category)}</span>` : ''}
      ${r.dish_type ? `<span class="chip">${esc(r.dish_type)}</span>` : ''}

/* ============ Brouillon local sécurisé par utilisateur ============ */
function draftKey(recipeId) {
  return ME ? `carnet_draft_${ME.id}_${recipeId || 'new'}` : null;
}

function saveDraft(recipeId) {
  const k = draftKey(recipeId);
  if (!k || !F) return;
  try {
    const payload = {
      id: F.id || null,
      title: F.title,
      description: F.description,
      category: F.category,
      dish_type: F.dish_type,
      visibility: F.visibility,
      prep_min: F.prep_min,
      cook_min: F.cook_min,
      servings: F.servings,
      rows: F.rows,
      steps: F.steps,
      notes: F.notes,
      savedAt: Date.now()
    };
    localStorage.setItem(k, JSON.stringify(payload));
  } catch (_) {}
}

function loadDraft(recipeId) {
  const k = draftKey(recipeId);
  if (!k) return null;
  try {
    const raw = localStorage.getItem(k);
    if (!raw) return null;
    const d = JSON.parse(raw);
    if (d && Date.now() - (d.savedAt || 0) < 24 * 3600 * 1000) return d;
    localStorage.removeItem(k);
  } catch (_) {}
  return null;
}

function clearDraft(recipeId) {
  const k = draftKey(recipeId);
  if (!k) return;
  try { localStorage.removeItem(k); } catch (_) {}
}

function drawRows() {
  const qNorm = norm(ING_Q);
  const filtered = ING.filter(i => {
    if (ING_CAT && i.category !== ING_CAT) return false;
    if (qNorm && !norm(i.name).includes(qNorm)) return false;
    return true;
  });

  const opts = sel => {
    const selectedItem = sel ? ING.find(x => x.id === sel) : null;
    const list = selectedItem && !filtered.some(x => x.id === sel) ? [selectedItem, ...filtered] : filtered;
    const placeholder = qNorm || ING_CAT ? `Choisir parmi ${filtered.length} résultat${filtered.length > 1 ? 's' : ''}…` : 'Choisir…';
    return `<option value="">${placeholder}</option>` + list.map(i =>
      `<option value="${i.id}" ${i.id === sel ? 'selected' : ''}>${esc(i.name)} (${i.unit === 'piece' ? 'pièce' : i.unit})</option>`
    ).join('');
  };

  $('#rows').innerHTML = F.rows.map((r, n) => {
    const i = ING.find(x => x.id === r.ingredient_id);
    return `<div class="row"><select data-n="${n}" aria-label="Ingrédient">${opts(r.ingredient_id)}</select><div class="qw"><input data-q="${n}" inputmode="decimal" placeholder="Quantité" value="${esc(r.quantity)}" aria-label="Quantité"><span class="u">${esc(sfx(i))}</span></div><button class="x" data-rm="${n}" type="button" aria-label="Retirer">✕</button></div>`;
  }).join('');

  $('#rows').oninput = e => {
    const d = e.target.dataset;
    if (d.n) { F.rows[d.n].ingredient_id = e.target.value; e.target.closest('.row').querySelector('.u').textContent = sfx(ING.find(x => x.id === e.target.value)); }
    if (d.q) F.rows[d.q].quantity = e.target.value;
    live();
    saveDraft(FORM_EDIT_ID);
  };
  $('#rows').onclick = e => { const n = e.target.dataset.rm; if (n !== undefined) { F.rows.splice(n, 1); drawRows(); live(); saveDraft(FORM_EDIT_ID); } };
}

function live() {
  const r = { recipe_ingredients: F.rows.filter(x => x.ingredient_id && num(x.quantity) > 0).map(x => ({ quantity: num(x.quantity), ingredients: ING.find(i => i.id === x.ingredient_id) })) };
  const s = Math.max(1, Math.round(num(F.servings)));
  $('#live').innerHTML = `<span></span><small>kcal</small><small>Protéines (g)</small><small>Glucides (g)</small><small>Lipides (g)</small><small>Total</small>${nutBlock(totals(r), 1)}<small>Par portion</small>${nutBlock(totals(r), s)}`;
}

async function resize(file, maxDim = 1600) {
  const img = await createImageBitmap(file), k = Math.min(1, maxDim / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = img.width * k; c.height = img.height * k;
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, 'image/jpeg', .85));
}

async function saveRecipe() {
  const rows = F.rows.filter(x => x.ingredient_id || x.quantity !== '');
  if (!F.title.trim()) return toast('Le titre est obligatoire', true);
  if (!CATS.includes(F.category)) return toast('Choisissez une catégorie', true);
  if (num(F.servings) < 1) return toast('Indiquez au moins 1 portion', true);
  if (!rows.length) return toast('Ajoutez au moins un ingrédient', true);
  if (rows.some(x => !x.ingredient_id || num(x.quantity) <= 0)) return toast('Chaque ingrédient doit avoir une quantité supérieure à 0', true);

  // Sauvegarde immédiate en brouillon avant tout appel réseau
  saveDraft(FORM_EDIT_ID);

  await runAction($('#save'), 'Enregistrement…', async () => {
    await safeMutate(async () => {
      let { cover_url, cover_path } = F, oldPath = null;
      if (F.file) {
        const path = `${ME.id}/${crypto.randomUUID()}.jpg`;
        const up = await db.storage.from('recipe-photos').upload(path, await resize(F.file), { contentType: 'image/jpeg' });
        if (up.error) throw new Error('Envoi de la photo impossible : ' + up.error.message);
        oldPath = F.cover_path;
        cover_path = path;
        cover_url = db.storage.from('recipe-photos').getPublicUrl(path).data.publicUrl;
        F.cover_url = cover_url;
        F.cover_path = cover_path;
        F.file = null;
      }

      const prep = F.steps && F.steps.trim() ? F.steps : '';
      const rec = {
        owner_id: ME.id,
        title: F.title.trim(),
        description: (F.description || '').trim(),
        category: F.category,
        dish_type: (F.dish_type || '').trim(),
        visibility: F.visibility === 'public' ? 'public' : 'private',
        cover_url,
        cover_path,
        prep_min: Math.round(num(F.prep_min)),
        cook_min: Math.round(num(F.cook_min)),
        servings: Math.round(num(F.servings)),
        steps: prep ? [prep] : [],
        notes: null,
        updated_at: new Date().toISOString()
      };

      let id = F.id;
      if (id) {
        const updated = ok(await db.from('recipes').update(rec).eq('id', id).eq('owner_id', ME.id).select('id'));
        if (!updated || !updated.length) throw new Error('Modification refusée : vous n’êtes pas propriétaire de cette recette.');
      } else {
        const inserted = ok(await db.from('recipes').insert(rec).select('id').single());
        id = inserted.id;
        // Mémorise l'ID immédiatement : un nouvel essai après coupure réseau mettra à jour sans créer de doublon
        F.id = id;
        saveDraft(FORM_EDIT_ID);
      }

      ok(await db.from('recipe_ingredients').delete().eq('recipe_id', id));
      ok(await db.from('recipe_ingredients').insert(rows.map((x, n) => ({
        recipe_id: id, ingredient_id: x.ingredient_id, quantity: num(x.quantity), position: n
      }))));

      const cleanNotes = (F.notes || '').trim();
      if (cleanNotes) {
        ok(await db.from('recipe_private_notes').upsert({
          recipe_id: id, owner_id: ME.id, notes: F.notes, updated_at: new Date().toISOString()
        }));
      } else {
        await db.from('recipe_private_notes').delete().eq('recipe_id', id).eq('owner_id', ME.id);
      }

      if (oldPath) await db.storage.from('recipe-photos').remove([oldPath]).catch(() => {});
    }, 'L’enregistrement de la recette');

    clearDraft(FORM_EDIT_ID);
    toast('Recette enregistrée');
    location.hash = '#/recette/' + F.id;
  });
}
