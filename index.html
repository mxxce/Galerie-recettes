    $('#ft').textContent = 'Nouvel ingrédient'; $('#sv').textContent = 'Ajouter l’ingrédient'; $('#sv').disabled = false; $('#cn').hidden = true;
  };
  const draw = () => {
    if ($('#ingTitle')) $('#ingTitle').textContent = `Ingrédients (${ING.length})`;
    const q = norm(filter);
    const l = ING.filter(i => (!catFilter || i.category === catFilter) && (!q || norm(i.name).includes(q)));
    const slice = l.slice(0, shown);
    $('#list').innerHTML = slice.length
      ? slice.map(i => `<div class="irow"><div><b>${esc(i.name)}</b> ${i.category ? `<span class="chip" style="padding:2px 10px;font-size:.78rem;margin-left:6px">${esc(i.category)}</span>` : ''}<div class="muted" style="font-size:.9rem">pour ${refText(i)} : ${fmt(i.kcal)} kcal, ${fmt(i.protein)} g protéines, ${fmt(i.carbs)} g glucides, ${fmt(i.fat)} g lipides</div></div>
        <div class="actions" style="margin:0"><button class="btn ghost" data-e="${i.id}" type="button">Modifier</button><button class="btn del" data-d="${i.id}" type="button">Supprimer</button></div></div>`).join('')
        + (l.length > shown ? `<div class="more"><button class="btn ghost" id="moreIng" type="button">Afficher plus (${l.length - shown} restants)</button></div>` : '')
      : '<p class="muted" style="margin:0">Aucun ingrédient ne correspond à votre recherche.</p>';
    const moreBtn = $('#moreIng');
    if (moreBtn) moreBtn.onclick = () => { shown += 50; draw(); };
  };
  $('#s').oninput = e => { filter = e.target.value; shown = 50; draw(); };
  $('#scat').onchange = e => { catFilter = e.target.value; shown = 50; draw(); };
  $('#u').onchange = e => { $('#ulw').hidden = e.target.value !== 'piece'; };
  $('#cn').onclick = reset;
  $('#sv').onclick = () => {
    const name = $('#n').value.trim(); if (!name) return toast('Le nom est obligatoire', true);
    const v = { name, category: $('#icat').value || null, unit: $('#u').value, kcal: num($('#k').value), protein: num($('#p').value), carbs: num($('#c').value), fat: num($('#f').value) };
    if (Object.values(v).some(x => typeof x === 'number' && x < 0)) return toast('Les valeurs ne peuvent pas être négatives', true);

    runAction($('#sv'), 'Enregistrement…', async () => {
      await safeMutate(async () => {
        if (editing) {
          const rows = ok(await db.from('ingredients').update(v).eq('id', editing).select('id'));
          if (!rows || !rows.length) throw new Error('Modification refusée : cet ingrédient appartient à un autre compte.');
          toast('Ingrédient modifié');
        } else {
          ok(await db.from('ingredients').insert({ ...v, created_by: ME.id }));
          toast('Ingrédient ajouté');
        }
      }, 'L’enregistrement de l’ingrédient');
      reset();
      await loadIng();
      draw();
    });
  };
  $('#list').onclick = async e => {
    const btn = e.target.closest('button'); if (!btn) return;
    const { e: eid, d: did } = btn.dataset;
    if (eid) {
      const i = ING.find(x => x.id === eid); editing = eid;
      $('#n').value = i.name; $('#icat').value = i.category || ''; $('#u').value = i.unit; $('#ulw').hidden = i.unit !== 'piece';
      $('#k').value = i.kcal; $('#p').value = i.protein; $('#c').value = i.carbs; $('#f').value = i.fat;
      $('#ft').textContent = 'Modifier l’ingrédient'; $('#sv').textContent = 'Enregistrer'; $('#cn').hidden = false;
      window.scrollTo(0, 0);
    }
    if (did) {
      const i = ING.find(x => x.id === did);
      confirmDialog({
        title: 'Supprimer cet ingrédient ?', name: i.name,
        text: 'Cette action est définitive. La suppression est refusée si l’ingrédient est utilisé dans une recette.',
        onConfirm: async () => {
          await safeMutate(async () => {
            const rows = ok(await db.from('ingredients').delete().eq('id', did).select('id'));
            if (!rows.length) throw new Error('Suppression non autorisée ou ingrédient utilisé.');
          }, 'La suppression de l’ingrédient');
          toast('Ingrédient supprimé');
          await loadIng(); draw();
        }
      });
    }
  };
  draw();
}

/* ============ Calendrier personnel & partagé des repas ============ */
const MEAL_TYPES = [
  ['petit-dejeuner', 'Petit-déjeuner'],
  ['dejeuner', 'Déjeuner'],
  ['diner', 'Dîner'],
  ['autre', 'Autre']
];
const MEAL_TYPE_LABEL = Object.fromEntries(MEAL_TYPES);
const MEAL_TYPE_ORDER = { 'petit-dejeuner': 1, 'dejeuner': 2, 'diner': 3, 'autre': 4 };
const CAL_ROLE_LABEL = { owner: 'Propriétaire', admin: 'Administrateur', member: 'Membre' };

const calIso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const parseIso = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const startOfWeek = d => { const day = (d.getDay() + 6) % 7; return addDays(d, -day); };

let CAL_OWNER_GUARD = '';
let CAL_SPACE = 'personal'; // 'personal' | 'shared'
let SHARED_CALS = [];
let PENDING_INVITES = [];
let ACTIVE_CAL_MEMBERS = [];
let CAL_SHARED_ID = '';

function resetCalendarState(uid = '') {
  CAL_OWNER_GUARD = uid;
  CAL_SPACE = 'personal';
  SHARED_CALS = [];
  PENDING_INVITES = [];
  ACTIVE_CAL_MEMBERS = [];
  CAL_SHARED_ID = '';
  CAL_FILTER_TYPE = '';
  CAL_FILTER_WHO = '';
  CAL_MEALS = [];
  MY_CAL_RECIPES = null;
}
let CAL_VIEW = 'month'; // 'month' | 'week' | 'list'
let CAL_CURSOR = new Date();
let CAL_SELECTED = calIso(new Date());
let CAL_FILTER_TYPE = '';
let CAL_FILTER_WHO = '';
let CAL_MEALS = [];
let MY_CAL_RECIPES = null;

function sortMeals(list) {
  return [...list].sort((a, b) =>
    (MEAL_TYPE_ORDER[a.meal_type] || 9) - (MEAL_TYPE_ORDER[b.meal_type] || 9) || (a.position || 0) - (b.position || 0)
  );
}

async function ensureMyCalRecipes() {
  const rows = ok(await withTimeout(
    db.from('recipes')
      .select('id, title, category, dish_type, cover_url, prep_min, cook_min, servings')
      .eq('owner_id', ME.id)
      .order('title', { ascending: true }),
    15000,
    'Le chargement de vos recettes'
  ));
  MY_CAL_RECIPES = rows || [];
  return MY_CAL_RECIPES;
}

async function loadSharedCalendars() {
  const rows = ok(await withTimeout(
    db.from('shared_calendar_members')
      .select('calendar_id, role, can_edit_meals, joined_at, shared_calendars(id, name, created_by, created_at)')
      .eq('user_id', ME.id)
      .order('joined_at', { ascending: true }),
    15000,
    'Le chargement des calendriers partagés'
  ));

  const list = (rows || [])
    .filter(r => r.shared_calendars)
    .map(r => ({
      id: r.shared_calendars.id,
      name: r.shared_calendars.name,
      created_by: r.shared_calendars.created_by,
      role: r.role,
      can_edit_meals: r.can_edit_meals,
      memberCount: 1
    }));

  if (list.length) {
    const ids = list.map(c => c.id);
    const mRows = ok(await withTimeout(
      db.from('shared_calendar_members').select('calendar_id').in('calendar_id', ids),
      10000
    ));
    const counts = {};
    (mRows || []).forEach(x => { counts[x.calendar_id] = (counts[x.calendar_id] || 0) + 1; });
    list.forEach(c => { c.memberCount = counts[c.id] || 1; });
  }

  SHARED_CALS = list;
  if (SHARED_CALS.length && !SHARED_CALS.some(c => c.id === CAL_SHARED_ID)) {
    CAL_SHARED_ID = SHARED_CALS[0].id;
  } else if (!SHARED_CALS.length) {
    CAL_SHARED_ID = '';
  }
}

async function loadPendingInvitations() {
  const rows = ok(await withTimeout(
    db.from('shared_calendar_invitations')
      .select('id, calendar_id, invited_by, role, created_at, shared_calendars(id, name)')
      .eq('invited_user_id', ME.id)
      .eq('status', 'pending')
      .order('created_at', { ascending: false }),
    12000,
    'Le chargement des invitations'
  ));

  const valid = (rows || []).filter(r => r.shared_calendars);
  const inviterIds = [...new Set(valid.map(r => r.invited_by).filter(Boolean))];
  let profilesMap = {};
  if (inviterIds.length) {
    const pRows = ok(await withTimeout(
      db.from('profiles').select('id, pseudo, avatar_url').in('id', inviterIds),
      10000
    ));
    (pRows || []).forEach(p => { profilesMap[p.id] = p; });
  }

  PENDING_INVITES = valid.map(r => ({
    id: r.id,
    calendar_id: r.calendar_id,
    calendar_name: r.shared_calendars.name,
    role: r.role,
    inviter: profilesMap[r.invited_by] || { id: r.invited_by, pseudo: 'Membre' }
  }));
}

async function loadActiveCalendarMembers(calendarId) {
  if (!calendarId) { ACTIVE_CAL_MEMBERS = []; return; }
  const rows = ok(await withTimeout(
    db.from('shared_calendar_members')
      .select('user_id, role, can_edit_meals, joined_at')
      .eq('calendar_id', calendarId)
      .order('joined_at', { ascending: true }),
    10000
  )) || [];

  const uids = [...new Set(rows.map(r => r.user_id))];
  let profMap = {};
  if (uids.length) {
    const pRows = ok(await withTimeout(
      db.from('profiles').select('id, pseudo, avatar_url').in('id', uids),
      10000
    )) || [];
    pRows.forEach(p => { profMap[p.id] = p; });
  }

  ACTIVE_CAL_MEMBERS = rows.map(r => ({
    user_id: r.user_id,
    role: r.role,
    can_edit_meals: r.can_edit_meals,
    pseudo: profMap[r.user_id]?.pseudo || 'Membre',
    avatar_url: profMap[r.user_id]?.avatar_url || null
  }));
}

function mealAssignBadgesHtml(m) {
  if (m.for_everyone !== false) {
    return `<span class="m-assign-wrap"><span class="m-assign">Tout le monde</span></span>`;
  }
  const ids = m.assignee_ids || [];
  if (!ids.length) {
    return `<span class="m-assign-wrap"><span class="m-assign person">Attribution spécifique</span></span>`;
  }
  const badges = ids.map(uid => {
    const mem = ACTIVE_CAL_MEMBERS.find(x => x.user_id === uid) || { id: uid, pseudo: 'Membre' };
    return `<span class="m-assign person">${avatarHtml({ id: uid, pseudo: mem.pseudo, avatar_url: mem.avatar_url }, 'xs')} @${esc(mem.pseudo)}</span>`;
  }).join('');
  return `<span class="m-assign-wrap">${badges}</span>`;
}

function mealPillWhoHtml(m) {
  if (m.for_everyone !== false) {
    return `<span class="cal-pill-who" title="Pour tout le monde">Tous</span>`;
  }
  const ids = m.assignee_ids || [];
  if (!ids.length) return '';
  const names = ids.map(uid => {
    const mem = ACTIVE_CAL_MEMBERS.find(x => x.user_id === uid);
    return mem ? `@${mem.pseudo}` : 'Membre';
  });
  const shortTxt = names.length === 1 ? names[0] : `${names[0]} +${names.length - 1}`;
  return `<span class="cal-pill-who person" title="${esc(names.join(', '))}">${esc(shortTxt)}</span>`;
}

function mealCardHtml(m, { isShared = false, canEdit = true } = {}) {
  const titleHtml = m.recipe_id
    ? `<a class="cal-card-title" href="#/recette/${m.recipe_id}">${esc(m.recipe_title)}</a>`
    : `<span class="cal-card-title">${esc(m.recipe_title)}</span>`;
  const assignBadge = isShared ? mealAssignBadgesHtml(m) : '';
  return `<div class="cal-card" data-meal="${m.id}">
    ${m.recipe_cover_url
      ? `<img class="cal-card-thumb" src="${esc(m.recipe_cover_url)}" alt="" loading="lazy">`
      : `<div class="cal-card-thumb">🍽</div>`}
    <div class="cal-card-body">
      <div>
        <span class="mtype ${esc(m.meal_type)}">${esc(MEAL_TYPE_LABEL[m.meal_type] || m.meal_type)}</span>
        ${assignBadge}
      </div>
      ${titleHtml}
      ${m.note ? `<div class="cal-card-note">${esc(m.note)}</div>` : ''}
    </div>
    ${canEdit ? `<div class="cal-card-acts">
      <button class="cal-act-btn" data-move-meal="${m.id}" type="button" title="Déplacer vers un autre jour" aria-label="Déplacer">⇄</button>
      <button class="cal-act-btn" data-edit-meal="${m.id}" type="button" title="Modifier ce repas" aria-label="Modifier">✎</button>
      <button class="cal-act-btn del" data-del-meal="${m.id}" type="button" title="Supprimer ce repas" aria-label="Supprimer">✕</button>
    </div>` : ''}
  </div>`;
}

async function loadMealsRange(startIso, endIso) {
  if (CAL_SPACE === 'shared') {
    if (!CAL_SHARED_ID) { CAL_MEALS = []; return; }
    const rows = ok(await withTimeout(
      db.from('shared_calendar_meals')
        .select('*, shared_calendar_meal_assignees(user_id)')
        .eq('calendar_id', CAL_SHARED_ID)
        .gte('meal_date', startIso)
        .lte('meal_date', endIso)
        .order('meal_date', { ascending: true }),
      15000,
      'Le chargement des repas partagés'
    ));
    CAL_MEALS = (rows || []).map(r => ({
      ...r,
      assignee_ids: (r.shared_calendar_meal_assignees || []).map(a => a.user_id)
    }));
  } else {
    const rows = ok(await withTimeout(
      db.from('personal_meals')
        .select('*')
        .eq('user_id', ME.id)
        .gte('meal_date', startIso)
        .lte('meal_date', endIso)
        .order('meal_date', { ascending: true }),
      15000,
      'Le chargement du calendrier'
    ));
    CAL_MEALS = rows || [];
  }
}

async function viewCalendar() {
  if (!SESSION || !ME) { resetCalendarState(''); location.hash = '#/connexion'; return; }
  if (CAL_OWNER_GUARD !== ME.id) resetCalendarState(ME.id);

  await loadPendingInvitations();

  let activeShared = null;
  if (CAL_SPACE === 'shared') {
    await loadSharedCalendars();
    activeShared = SHARED_CALS.find(c => c.id === CAL_SHARED_ID) || null;
    await loadActiveCalendarMembers(activeShared?.id || '');
  } else {
    ACTIVE_CAL_MEMBERS = [];
  }

  const isShared = CAL_SPACE === 'shared';
  const canEdit = !isShared || (!!activeShared && (activeShared.role === 'owner' || activeShared.role === 'admin' || activeShared.can_edit_meals));

  const todayIso = calIso(new Date());
  const y = CAL_CURSOR.getFullYear(), m = CAL_CURSOR.getMonth();

  let rangeStart, rangeEnd, periodTitle;
  if (CAL_VIEW === 'month') {
    const firstOfMonth = new Date(y, m, 1);
    const lastOfMonth = new Date(y, m + 1, 0);
    rangeStart = startOfWeek(firstOfMonth);
    rangeEnd = addDays(startOfWeek(lastOfMonth), 6);
    periodTitle = firstOfMonth.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
  } else if (CAL_VIEW === 'week') {
    rangeStart = startOfWeek(CAL_CURSOR);
    rangeEnd = addDays(rangeStart, 6);
    const sTxt = rangeStart.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
    const eTxt = rangeEnd.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' });
    periodTitle = `${sTxt} – ${eTxt}`;
  } else {
    rangeStart = parseIso(todayIso);
    rangeEnd = addDays(rangeStart, 30);
    periodTitle = 'Prochains repas (30 jours)';
  }

  if (!isShared || activeShared) {
    await loadMealsRange(calIso(rangeStart), calIso(rangeEnd));
  } else {
    CAL_MEALS = [];
  }

  if (isShared && CAL_FILTER_WHO && CAL_FILTER_WHO !== 'everyone') {
    const stillMember = ACTIVE_CAL_MEMBERS.some(mem => mem.user_id === CAL_FILTER_WHO);
    if (!stillMember) CAL_FILTER_WHO = '';
  }

  const hasActiveFilters = Boolean(CAL_FILTER_TYPE || (isShared && CAL_FILTER_WHO));

  const visibleMeals = CAL_MEALS.filter(x => {
    if (CAL_FILTER_TYPE && x.meal_type !== CAL_FILTER_TYPE) return false;
    if (isShared && CAL_FILTER_WHO) {
      if (CAL_FILTER_WHO === 'everyone') {
        if (x.for_everyone === false) return false;
      } else {
        const concernsPerson = x.for_everyone !== false || (x.assignee_ids || []).includes(CAL_FILTER_WHO);
        if (!concernsPerson) return false;
      }
    }
    return true;
  });

  const byDate = {};
  visibleMeals.forEach(item => {
    (byDate[item.meal_date] ||= []).push(item);
  });
  Object.keys(byDate).forEach(k => { byDate[k] = sortMeals(byDate[k]); });

  const invitesBannerHtml = (isShared && PENDING_INVITES.length) ? `
    <div class="inv-box" id="calInvBox">
      <h3>Invitation${PENDING_INVITES.length > 1 ? 's' : ''} reçue${PENDING_INVITES.length > 1 ? 's' : ''} (${PENDING_INVITES.length})</h3>
      <div class="inv-list">
        ${PENDING_INVITES.map(inv => `
          <div class="inv-item">
            <div style="display:flex;align-items:center;gap:10px;min-width:0">
              ${avatarHtml(inv.inviter, 'sm')}
              <div style="min-width:0">
                <div><b>${esc(inv.calendar_name)}</b> <span class="sc-role">${esc(CAL_ROLE_LABEL[inv.role] || inv.role)}</span></div>
                <div class="muted" style="font-size:.84rem">Invité par @${esc(inv.inviter.pseudo)}</div>
              </div>
            </div>
            <div style="display:flex;gap:8px">
              <button class="btn pri sm" data-accept-inv="${inv.id}" data-inv-cal="${inv.calendar_id}" type="button">Accepter</button>
              <button class="btn ghost sm" data-decline-inv="${inv.id}" type="button">Refuser</button>
            </div>
          </div>`).join('')}
      </div>
    </div>` : '';

  const sharedSwitcherHtml = isShared ? `
    ${invitesBannerHtml}
    <div class="sc-bar">
      <div class="sc-list" id="scSelector">
        ${SHARED_CALS.map(c => `
          <button class="sc-chip ${c.id === CAL_SHARED_ID ? 'on' : ''}" data-pick-cal="${c.id}" type="button">
            <span>${esc(c.name)}</span>
            <span class="sc-role">${esc(CAL_ROLE_LABEL[c.role] || c.role)}</span>
          </button>`).join('')}
        <button class="btn ghost sm" id="newSharedCalBtn" type="button">+ Nouveau calendrier</button>
      </div>
      ${activeShared ? `<div class="sc-meta">
        ${!canEdit ? `<span class="sc-readonly-badge" title="Vous pouvez consulter ce calendrier mais pas modifier ses repas">Lecture seule</span>` : ''}
        <button class="btn ghost sm" id="manageMembersBtn" type="button">Membres (${activeShared.memberCount})</button>
        ${(activeShared.role === 'owner' || activeShared.role === 'admin')
          ? `<button class="btn ghost sm" id="renameSharedCalBtn" type="button">Renommer</button>` : ''}
        ${activeShared.role !== 'owner'
          ? `<button class="btn del sm" id="leaveSharedCalBtn" type="button">Quitter</button>` : ''}
        ${activeShared.role === 'owner'
          ? `<button class="btn del sm" id="deleteSharedCalBtn" type="button">Supprimer</button>` : ''}
      </div>` : ''}
    </div>` : '';

  let bodyHtml = '';
  if (isShared && !activeShared) {
    bodyHtml = `<div class="empty">
      <h2 style="margin-bottom:8px">Aucun calendrier partagé pour le moment</h2>
      <p style="max-width:480px;margin:0 auto 18px">Créez un calendrier commun (par exemple « Famille ») pour planifier et partager vos menus à plusieurs.</p>
      <button class="btn pri" id="emptyCreateSharedBtn" type="button">+ Créer un calendrier partagé</button>
    </div>`;
  } else if (CAL_VIEW === 'month') {
    const days = [];
    for (let d = new Date(rangeStart); d <= rangeEnd; d = addDays(d, 1)) days.push(new Date(d));
    const dows = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];
    const selMeals = byDate[CAL_SELECTED] || [];
    const selDateLabel = parseIso(CAL_SELECTED).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });

    bodyHtml = `
      <div class="cal-grid-wrap">
        <div class="cal-dow">${dows.map(d => `<div>${d}</div>`).join('')}</div>
        <div class="cal-grid" id="calMonthGrid">
          ${days.map(d => {
            const iso = calIso(d);
            const inMonth = d.getMonth() === m;
            const dayMeals = byDate[iso] || [];
            return `<div class="cal-cell ${inMonth ? '' : 'out'} ${iso === todayIso ? 'today' : ''} ${iso === CAL_SELECTED ? 'sel' : ''}" data-day="${iso}">
              <div class="cal-cell-head">
                <span class="cal-daynum">${d.getDate()}</span>
                ${canEdit ? `<button class="cal-cell-add" data-add-day="${iso}" type="button" title="Planifier un repas le ${esc(iso)}" aria-label="Ajouter un repas">+</button>` : ''}
              </div>
              <div class="cal-dots">${dayMeals.slice(0, 5).map(x => `<span class="cal-dot ${esc(x.meal_type)}"></span>`).join('')}</div>
              <div class="cal-mini-list">
                ${dayMeals.map(x => `<div class="cal-pill-meal" data-open-meal="${x.id}" title="${esc(MEAL_TYPE_LABEL[x.meal_type] + ' : ' + x.recipe_title)}">
                  ${x.recipe_cover_url ? `<img src="${esc(x.recipe_cover_url)}" alt="">` : ''}
                  <span class="cal-pill-txt">${esc(x.recipe_title)}</span>
                  ${isShared ? mealPillWhoHtml(x) : ''}
                </div>`).join('')}
              </div>
            </div>`;
          }).join('')}
        </div>
      </div>
      <div class="cal-mob-daypanel panel" style="padding:16px">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px">
          <div>
            <h3 style="font-size:1.12rem;text-transform:capitalize;margin:0">${esc(selDateLabel)}</h3>
            <span class="muted" style="font-size:.82rem">${selMeals.length ? `${selMeals.length} repas programmé${selMeals.length > 1 ? 's' : ''}` : 'Journée libre'}</span>
          </div>
          ${canEdit ? `<button class="btn pri sm" data-add-day="${CAL_SELECTED}" type="button">+ Repas</button>` : ''}
        </div>
        ${selMeals.length
          ? `<div style="display:flex;flex-direction:column;gap:8px">${selMeals.map(x => mealCardHtml(x, { isShared, canEdit })).join('')}</div>`
          : `<p class="muted" style="margin:0;font-size:.92rem">Aucun repas planifié pour cette journée.</p>`}
      </div>`;
  } else if (CAL_VIEW === 'week') {
    const days = [];
    for (let i = 0; i < 7; i++) days.push(addDays(rangeStart, i));
    bodyHtml = `<div class="cal-week">
      ${days.map(d => {
        const iso = calIso(d);
        const dayMeals = byDate[iso] || [];
        const label = d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
        return `<div class="cal-wday ${iso === todayIso ? 'today' : ''}">
          <div class="cal-wday-head">
            <b style="text-transform:capitalize">${esc(label)}</b>
            ${canEdit ? `<button class="cal-cell-add" data-add-day="${iso}" type="button" title="Ajouter un repas">+</button>` : ''}
          </div>
          ${dayMeals.length
            ? dayMeals.map(x => mealCardHtml(x, { isShared, canEdit })).join('')
            : `<p class="muted" style="margin:4px 0;font-size:.85rem">Aucun repas</p>`}
        </div>`;
      }).join('')}
    </div>`;
  } else {
    const datesWithMeals = Object.keys(byDate).sort();
    bodyHtml = datesWithMeals.length
      ? datesWithMeals.map(iso => {
          const dLabel = parseIso(iso).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
          return `<div class="panel cal-list-group" style="padding:16px">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px">
              <h3 style="margin:0">${esc(dLabel)}</h3>
              ${canEdit ? `<button class="btn ghost sm" data-add-day="${iso}" type="button">+ Ajouter</button>` : ''}
            </div>
            <div style="display:flex;flex-direction:column;gap:8px">${byDate[iso].map(x => mealCardHtml(x, { isShared, canEdit })).join('')}</div>
          </div>`;
        }).join('')
      : (hasActiveFilters && CAL_MEALS.length
          ? `<div class="empty">Aucun repas ne correspond aux filtres sélectionnés.<br><button class="btn ghost" id="calEmptyReset" style="margin-top:14px" type="button">Afficher tous les repas</button></div>`
          : `<div class="empty">Aucun repas planifié sur les 30 prochains jours.${canEdit ? `<br><button class="btn pri" style="margin-top:14px" data-add-day="${todayIso}" type="button">+ Planifier un repas</button>` : ''}</div>`);
  }

  app.innerHTML = `
    <div class="cal-top">
      <div>
        <h1 style="font-size:clamp(1.7rem,4vw,2.35rem)">${isShared ? (activeShared ? esc(activeShared.name) : 'Calendriers partagés') : 'Mon calendrier'}</h1>
        <p class="muted" style="margin:4px 0 0">${isShared ? 'Planifiez vos repas communs en famille ou entre proches.' : 'Organisez vos menus personnels en toute confidentialité.'}</p>
      </div>
      <div class="cal-spaces" id="calSpaceSwitch">
        <button class="tab ${!isShared ? 'on' : ''}" data-space="personal" type="button">Mon calendrier</button>
        <button class="tab ${isShared ? 'on' : ''}" data-space="shared" type="button">Calendriers partagés${PENDING_INVITES.length ? `<span class="inv-badge">${PENDING_INVITES.length}</span>` : ''}</button>
      </div>

    ${sharedSwitcherHtml}

    ${(!isShared || activeShared) ? `
      <div class="cal-bar">
        <div class="cal-nav">
          <div class="cal-nav-main">
            <button class="btn ghost" id="calPrev" type="button" aria-label="Période précédente">‹</button>
            <h2>${esc(periodTitle)}</h2>
            <button class="btn ghost" id="calNext" type="button" aria-label="Période suivante">›</button>
          </div>
          <div class="cal-nav-quick">
            <button class="btn ghost sm" id="calToday" type="button">Aujourd'hui</button>
            <input type="date" id="calJumpDate" class="cal-date-inp" value="${calIso(CAL_CURSOR)}" title="Aller directement à une date" aria-label="Aller à une date">
          </div>
        </div>
        <div class="cal-views" id="calViews">
          <button class="${CAL_VIEW === 'month' ? 'on' : ''}" data-cview="month" type="button">Mois</button>
          <button class="${CAL_VIEW === 'week' ? 'on' : ''}" data-cview="week" type="button">Semaine</button>
          <button class="${CAL_VIEW === 'list' ? 'on' : ''}" data-cview="list" type="button">Liste</button>
        </div>
        ${canEdit ? `<button class="btn pri" data-add-day="${CAL_SELECTED || todayIso}" type="button">+ Planifier un repas</button>` : ''}
      </div>

      <div class="cal-filters" id="calFiltersBar">
        <div class="cal-fgroup">
          <span class="cal-flabel">Repas :</span>
          <button class="pill ${CAL_FILTER_TYPE === '' ? 'on' : ''}" data-mtype="" type="button">Tous</button>
          ${MEAL_TYPES.map(([k, l]) => `<button class="pill ${CAL_FILTER_TYPE === k ? 'on' : ''}" data-mtype="${k}" type="button">${esc(l)}</button>`).join('')}
        </div>

        ${isShared ? `
          <div class="cal-fgroup">
            <span class="cal-flabel">Pour :</span>
            <button class="pill ${CAL_FILTER_WHO === '' ? 'on' : ''}" data-mwho="" type="button">Tous</button>
            <button class="pill ${CAL_FILTER_WHO === 'everyone' ? 'on' : ''}" data-mwho="everyone" type="button">Tout le monde</button>
            ${ACTIVE_CAL_MEMBERS.map(mem => `
              <button class="pill cal-pill-who-f ${CAL_FILTER_WHO === mem.user_id ? 'on' : ''}" data-mwho="${mem.user_id}" type="button">
                ${avatarHtml({ id: mem.user_id, pseudo: mem.pseudo, avatar_url: mem.avatar_url }, 'xs')}
                <span>@${esc(mem.pseudo)}</span>
              </button>`).join('')}
          </div>` : ''}

        ${hasActiveFilters ? `
          <div class="cal-fstatus">
            <span>${visibleMeals.length} / ${CAL_MEALS.length} repas</span>
            <button class="btn ghost sm" id="calResetFilters" type="button">Réinitialiser</button>
          </div>` : ''}
      </div>
    ` : ''}

    <div id="calBody">${bodyHtml}</div>`;

  $('#calSpaceSwitch').onclick = e => {
    const b = e.target.closest('[data-space]');
    if (!b || b.dataset.space === CAL_SPACE) return;
    CAL_SPACE = b.dataset.space;
    CAL_FILTER_WHO = '';
    viewCalendar();
  };

  if ($('#newSharedCalBtn')) $('#newSharedCalBtn').onclick = () => openCreateSharedCalendarModal();
  if ($('#emptyCreateSharedBtn')) $('#emptyCreateSharedBtn').onclick = () => openCreateSharedCalendarModal();

  if ($('#calInvBox')) {
    $('#calInvBox').onclick = async e => {
      const accBtn = e.target.closest('[data-accept-inv]');
      if (accBtn) {
        const invId = accBtn.dataset.acceptInv;
        const calId = accBtn.dataset.invCal;
        await runAction(accBtn, '…', async () => {
          await safeMutate(async () => ok(
            await db.rpc('respond_calendar_invitation', { p_invitation_id: invId, p_accept: true })
          ), 'L’acceptation de l’invitation');
          CAL_SHARED_ID = calId;
          toast('Invitation acceptée');
          await viewCalendar();
        });
        return;
      }
      const decBtn = e.target.closest('[data-decline-inv]');
      if (decBtn) {
        const invId = decBtn.dataset.declineInv;
        await runAction(decBtn, '…', async () => {
          await safeMutate(async () => ok(
            await db.rpc('respond_calendar_invitation', { p_invitation_id: invId, p_accept: false })
          ), 'Le refus de l’invitation');
          toast('Invitation refusée');
          await viewCalendar();
        });
      }
    };
  }

  if ($('#manageMembersBtn') && activeShared) {
    $('#manageMembersBtn').onclick = () => openCalendarMembersModal(activeShared);
  }

  if ($('#leaveSharedCalBtn') && activeShared) {
    $('#leaveSharedCalBtn').onclick = () => confirmLeaveSharedCalendar(activeShared);
  }

  if ($('#scSelector')) {
    $('#scSelector').onclick = e => {
      const b = e.target.closest('[data-pick-cal]');
      if (!b || b.dataset.pickCal === CAL_SHARED_ID) return;
      CAL_SHARED_ID = b.dataset.pickCal;
      CAL_FILTER_WHO = '';
      viewCalendar();
    };
  }

  if ($('#renameSharedCalBtn') && activeShared) {
    $('#renameSharedCalBtn').onclick = () => openRenameSharedCalendarModal(activeShared);
  }

  if ($('#deleteSharedCalBtn') && activeShared) {
    $('#deleteSharedCalBtn').onclick = () => confirmDialog({
      title: 'Supprimer ce calendrier partagé ?',
      name: activeShared.name,
      text: 'Tous les repas programmés et les accès des membres de ce calendrier seront supprimés définitivement.',
      confirmLabel: 'Supprimer le calendrier',
      onConfirm: async () => {
        await safeMutate(async () => {
          ok(await db.from('shared_calendars').delete().eq('id', activeShared.id));
        }, 'La suppression du calendrier');
        CAL_SHARED_ID = '';
        toast('Calendrier partagé supprimé');
        await viewCalendar();
      }
    });
  }

  if ($('#calPrev')) {
    $('#calPrev').onclick = () => {
      CAL_CURSOR = CAL_VIEW === 'week'
        ? addDays(CAL_CURSOR, -7)
        : new Date(CAL_CURSOR.getFullYear(), CAL_CURSOR.getMonth() - 1, 1);
      viewCalendar();
    };
    $('#calNext').onclick = () => {
      CAL_CURSOR = CAL_VIEW === 'week'
        ? addDays(CAL_CURSOR, 7)
        : new Date(CAL_CURSOR.getFullYear(), CAL_CURSOR.getMonth() + 1, 1);
      viewCalendar();
    };
    $('#calToday').onclick = () => {
      CAL_CURSOR = new Date();
      CAL_SELECTED = calIso(CAL_CURSOR);
      viewCalendar();
    };
    if ($('#calJumpDate')) {
      $('#calJumpDate').onchange = e => {
        if (!e.target.value) return;
        CAL_CURSOR = parseIso(e.target.value);
        CAL_SELECTED = e.target.value;
        viewCalendar();
      };
    }
    $('#calViews').onclick = e => {
      const b = e.target.closest('[data-cview]');
      if (!b || b.dataset.cview === CAL_VIEW) return;
      CAL_VIEW = b.dataset.cview;
      viewCalendar();
    };
    $('#calFiltersBar').onclick = e => {
      const tBtn = e.target.closest('[data-mtype]');
      if (tBtn) {
        CAL_FILTER_TYPE = tBtn.dataset.mtype;
        viewCalendar();
        return;
      }
      const wBtn = e.target.closest('[data-mwho]');
      if (wBtn) {
        CAL_FILTER_WHO = wBtn.dataset.mwho;
        viewCalendar();
        return;
      }
      if (e.target.closest('#calResetFilters')) {
        CAL_FILTER_TYPE = '';
        CAL_FILTER_WHO = '';
        viewCalendar();
      }
    };
  }

  if ($('#calEmptyReset')) {
    $('#calEmptyReset').onclick = () => {
      CAL_FILTER_TYPE = '';
      CAL_FILTER_WHO = '';
      viewCalendar();
    };
  }

  app.onclick = e => {
    const addBtn = e.target.closest('[data-add-day]');
    if (addBtn && canEdit) {
      openMealModal(addBtn.dataset.addDay, null);
      return;
    }
    const mealPill = e.target.closest('[data-open-meal]');
    if (mealPill) {
      const mObj = CAL_MEALS.find(x => x.id === mealPill.dataset.openMeal);
      if (mObj) {
        if (canEdit) openMealModal(mObj.meal_date, mObj);
        else if (mObj.recipe_id) location.hash = `#/recette/${mObj.recipe_id}`;
        else toast(`${MEAL_TYPE_LABEL[mObj.meal_type] || mObj.meal_type} : ${mObj.recipe_title}`);
      }
      return;
    }
    const moveBtn = e.target.closest('[data-move-meal]');
    if (moveBtn && canEdit) {
      const mObj = CAL_MEALS.find(x => x.id === moveBtn.dataset.moveMeal);
      if (mObj) openMoveMealModal(mObj);
      return;
    }
    const editBtn = e.target.closest('[data-edit-meal]');
    if (editBtn && canEdit) {
      const mObj = CAL_MEALS.find(x => x.id === editBtn.dataset.editMeal);
      if (mObj) openMealModal(mObj.meal_date, mObj);
      return;
    }
    const delBtn = e.target.closest('[data-del-meal]');
    if (delBtn && canEdit) {
      const mObj = CAL_MEALS.find(x => x.id === delBtn.dataset.delMeal);
      if (mObj) confirmDeleteMeal(mObj);
      return;
    }
    const dayCell = e.target.closest('[data-day]');
    if (dayCell && CAL_VIEW === 'month') {
      CAL_SELECTED = dayCell.dataset.day;
      viewCalendar();
    }
  };
}

function openCreateSharedCalendarModal() {
  openModal(`
    <h2>Nouveau calendrier partagé</h2>
    <p class="muted" style="margin-bottom:14px">Créez un espace commun indépendant pour organiser vos repas à plusieurs.</p>
    <form class="form" id="newCalForm">
      <label for="scName">Nom du calendrier *</label>
      <input id="scName" maxlength="60" placeholder="Ex. Famille, Colocation, Vacances d'été…" required>
      <div class="mb">
        <button class="btn ghost" id="scCancel" type="button">Annuler</button>
        <button class="btn pri" id="scCreate" type="submit">Créer le calendrier</button>
      </div>
    </form>`, (el, close) => {
    const inp = el.querySelector('#scName');
    el.querySelector('#scCancel').onclick = close;
    inp.focus();

    el.querySelector('#newCalForm').onsubmit = async e => {
      e.preventDefault();
      const name = inp.value.trim();
      if (!name) return toast('Indiquez un nom pour le calendrier', true);

      await runAction(el.querySelector('#scCreate'), 'Création…', async () => {
        const created = await safeMutate(async () => ok(
          await db.from('shared_calendars')
            .insert({ name, created_by: ME.id })
            .select('id, name')
            .single()
        ), 'La création du calendrier partagé');

        CAL_SPACE = 'shared';
        CAL_SHARED_ID = created.id;
        toast(`Calendrier « ${created.name} » créé`);
        close();
        await viewCalendar();
      });
    };
  });
}

function openRenameSharedCalendarModal(cal) {
  openModal(`
    <h2>Renommer le calendrier</h2>
    <form class="form" id="renCalForm">
      <label for="scRenName">Nouveau nom *</label>
      <input id="scRenName" maxlength="60" value="${esc(cal.name)}" required>
      <div class="mb">
        <button class="btn ghost" id="scRenCancel" type="button">Annuler</button>
        <button class="btn pri" id="scRenSave" type="submit">Enregistrer</button>
      </div>
    </form>`, (el, close) => {
    const inp = el.querySelector('#scRenName');
    el.querySelector('#scRenCancel').onclick = close;
    inp.focus();
    inp.select();

    el.querySelector('#renCalForm').onsubmit = async e => {
      e.preventDefault();
      const name = inp.value.trim();
      if (!name) return toast('Le nom ne peut pas être vide', true);

      await runAction(el.querySelector('#scRenSave'), 'Enregistrement…', async () => {
        await safeMutate(async () => ok(
          await db.from('shared_calendars')
            .update({ name, updated_at: new Date().toISOString() })
            .eq('id', cal.id)
        ), 'Le renommage du calendrier');

        toast('Nom du calendrier mis à jour');
        close();
        await viewCalendar();
      });
    };
  });
}

function confirmLeaveSharedCalendar(cal, onDone) {
  confirmDialog({
    title: 'Quitter ce calendrier partagé ?',
    name: cal.name,
    text: 'Vous n’aurez plus accès aux repas de ce calendrier partagé, sauf si vous êtes invité à nouveau.',
    confirmLabel: 'Quitter le calendrier',
    onConfirm: async () => {
      await safeMutate(async () => ok(
        await db.from('shared_calendar_members')
          .delete()
          .eq('calendar_id', cal.id)
          .eq('user_id', ME.id)
      ), 'La sortie du calendrier');
      CAL_SHARED_ID = '';
      toast('Vous avez quitté le calendrier');
      if (onDone) onDone();
      await viewCalendar();
    }
  });
}

async function openCalendarMembersModal(cal) {
  const canManage = cal.role === 'owner' || cal.role === 'admin';

  openModal(`
    <h2>Membres — ${esc(cal.name)}</h2>
    <div id="cmBody"><p class="muted">Chargement des membres…</p></div>
    <div class="mb">
      ${cal.role !== 'owner' ? `<button class="btn del" id="cmLeave" type="button" style="margin-right:auto">Quitter</button>` : ''}
      <button class="btn ghost" id="cmClose" type="button">Fermer</button>
    </div>`, async (el, close) => {
    el.querySelector('#cmClose').onclick = close;
    const leaveBtn = el.querySelector('#cmLeave');
    if (leaveBtn) leaveBtn.onclick = () => confirmLeaveSharedCalendar(cal, close);

    const body = el.querySelector('#cmBody');

    const refreshModal = async () => {
      try {
        const mRows = ok(await withTimeout(
          db.from('shared_calendar_members')
            .select('user_id, role, can_edit_meals, joined_at')
            .eq('calendar_id', cal.id)
            .order('joined_at', { ascending: true }),
          12000
        ));

        let sentInvites = [];
        if (canManage) {
          sentInvites = ok(await withTimeout(
            db.from('shared_calendar_invitations')
              .select('id, invited_user_id, role, created_at')
              .eq('calendar_id', cal.id)
              .eq('status', 'pending')
              .order('created_at', { ascending: false }),
            12000
          )) || [];
        }

        const allUserIds = [...new Set([
          ...(mRows || []).map(x => x.user_id),
          ...sentInvites.map(x => x.invited_user_id)
        ])];

        let profilesMap = {};
        if (allUserIds.length) {
          const pRows = ok(await withTimeout(
            db.from('profiles').select('id, pseudo, avatar_url').in('id', allUserIds),
            10000
          ));
          (pRows || []).forEach(p => { profilesMap[p.id] = p; });
        }

        const memberIds = new Set((mRows || []).map(x => x.user_id));
        const pendingIds = new Set(sentInvites.map(x => x.invited_user_id));

        const membersHtml = (mRows || []).map(m => {
          const prof = profilesMap[m.user_id] || { id: m.user_id, pseudo: 'Utilisateur' };
          const isSelf = m.user_id === ME.id;
          const canChangeRole = cal.role === 'owner' && !isSelf;
          const canTogglePerm = canManage && !isSelf && m.role === 'member';
          const canKick = !isSelf && (
            cal.role === 'owner' || (cal.role === 'admin' && m.role === 'member')
          );

          const roleBadge = canChangeRole
            ? `<select class="mem-role-sel" data-role-uid="${m.user_id}" aria-label="Rôle de @${esc(prof.pseudo)}">
                <option value="member" ${m.role === 'member' ? 'selected' : ''}>Membre</option>
                <option value="admin" ${m.role === 'admin' ? 'selected' : ''}>Administrateur</option>
              </select>`
            : `<span class="sc-role">${esc(CAL_ROLE_LABEL[m.role] || m.role)}</span>${m.role === 'member' && !m.can_edit_meals ? ` <span class="sc-role" style="background:#FBE8EB;color:var(--accent)">Lecture seule</span>` : ''}`;

          const permBtn = canTogglePerm
            ? `<button type="button" class="perm-toggle ${m.can_edit_meals ? 'on' : ''}" data-perm-uid="${m.user_id}" data-perm-cur="${m.can_edit_meals ? '1' : '0'}" title="Autoriser ou restreindre l'ajout et la modification des repas">${m.can_edit_meals ? 'Peut modifier' : 'Lecture seule'}</button>`
            : '';

          return `<div class="mem-row">
            <div class="mem-user">
              ${avatarHtml(prof, 'sm')}
              <div style="min-width:0">
                <div style="font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">@${esc(prof.pseudo)}${isSelf ? ' (vous)' : ''}</div>
                <div style="margin-top:3px">${roleBadge}</div>
              </div>
            </div>
            <div class="mem-controls">
              ${permBtn}
              ${canKick ? `<button class="btn del sm" data-kick-uid="${m.user_id}" data-kick-name="@${esc(prof.pseudo)}" type="button">Retirer</button>` : ''}
            </div>
          </div>`;
        }).join('');

        const pendingHtml = (canManage && sentInvites.length) ? `
          <div style="margin-top:16px">
            <b style="font-size:.9rem;display:block;margin-bottom:6px">Invitations en attente (${sentInvites.length})</b>
            ${sentInvites.map(inv => {
              const prof = profilesMap[inv.invited_user_id] || { id: inv.invited_user_id, pseudo: 'Utilisateur' };
              return `<div class="mem-row">
                <div class="mem-user">
                  ${avatarHtml(prof, 'xs')}
                  <span style="font-weight:600">@${esc(prof.pseudo)}</span>
                  <span class="sc-role">${esc(CAL_ROLE_LABEL[inv.role] || inv.role)}</span>
                </div>
                <button class="btn ghost sm" data-cancel-inv="${inv.id}" type="button">Annuler</button>
              </div>`;
            }).join('')}
          </div>` : '';

        const inviteFormHtml = canManage ? `
          <div style="margin-top:16px;padding-top:14px;border-top:1.5px solid var(--line)">
            <b style="font-size:.95rem;display:block;margin-bottom:8px">Inviter un membre par pseudo</b>
            <div style="display:grid;grid-template-columns:1fr ${cal.role === 'owner' ? '145px' : ''};gap:8px">
              <input id="cmSearchUser" type="search" placeholder="Rechercher un @pseudo…" autocomplete="off">
              ${cal.role === 'owner' ? `<select id="cmInviteRole" aria-label="Rôle attribué">
                <option value="member">Membre</option>
                <option value="admin">Administrateur</option>
              </select>` : ''}
            </div>
            <div id="cmSearchResults" style="display:flex;flex-direction:column;gap:6px;margin-top:8px"></div>
          </div>` : '';

        body.innerHTML = `
          <div class="role-guide">
            <b>Propriétaire</b> : contrôle total • <b>Administrateur</b> : gère membres et repas • <b>Membre</b> : consulte et modifie selon ses droits.
          </div>
          <div>${membersHtml}</div>
          ${pendingHtml}
          ${inviteFormHtml}`;

        /* Changer le rôle (Propriétaire uniquement) */
        body.querySelectorAll('[data-role-uid]').forEach(sel => {
          sel.onchange = async () => {
            const targetUid = sel.dataset.roleUid;
            const nextRole = sel.value;
            sel.disabled = true;
            try {
              await safeMutate(async () => ok(
                await db.from('shared_calendar_members')
                  .update({
                    role: nextRole,
                    can_edit_meals: nextRole === 'admin' ? true : undefined
                  })
                  .eq('calendar_id', cal.id)
                  .eq('user_id', targetUid)
              ), 'La modification du rôle');
              toast(`Rôle mis à jour : ${CAL_ROLE_LABEL[nextRole] || nextRole}`);
              await refreshModal();
              await viewCalendar();
            } catch (ex) {
              toast(humanizeError(ex), true);
              await refreshModal();
            }
          };
        });

        /* Activer / désactiver le droit de modifier les repas d'un membre */
        body.querySelectorAll('[data-perm-uid]').forEach(btn => {
          btn.onclick = () => runAction(btn, '…', async () => {
            const targetUid = btn.dataset.permUid;
            const nextPerm = btn.dataset.permCur !== '1';
            await safeMutate(async () => ok(
              await db.from('shared_calendar_members')
                .update({ can_edit_meals: nextPerm })
                .eq('calendar_id', cal.id)
                .eq('user_id', targetUid)
            ), 'La mise à jour des permissions');
            toast(nextPerm ? 'Modification des repas autorisée' : 'Membre passé en lecture seule');
            await refreshModal();
            await viewCalendar();
          });
        });

        /* Retirer un membre */
        body.querySelectorAll('[data-kick-uid]').forEach(btn => {
          btn.onclick = () => runAction(btn, '…', async () => {
            await safeMutate(async () => ok(
              await db.from('shared_calendar_members')
                .delete()
                .eq('calendar_id', cal.id)
                .eq('user_id', btn.dataset.kickUid)
            ), 'Le retrait du membre');
            toast(`${btn.dataset.kickName} a été retiré du calendrier`);
            await refreshModal();
            await viewCalendar();
          });
        });

        /* Annuler une invitation en attente */
        body.querySelectorAll('[data-cancel-inv]').forEach(btn => {
          btn.onclick = () => runAction(btn, '…', async () => {
            await safeMutate(async () => ok(
              await db.from('shared_calendar_invitations')
                .delete()
                .eq('id', btn.dataset.cancelInv)
            ), 'L’annulation de l’invitation');
            toast('Invitation annulée');
            await refreshModal();
          });
        });

        /* Recherche et envoi d'invitation par pseudo */
        if (canManage) {
          const searchInp = body.querySelector('#cmSearchUser');
          const resBox = body.querySelector('#cmSearchResults');
          const runUserSearch = debounce(async () => {
            const term = searchInp.value.trim().toLowerCase();
            if (term.length < 2) {
              resBox.innerHTML = '';
              return;
            }
            try {
              const users = ok(await withTimeout(
                db.from('profiles')
                  .select('id, pseudo, avatar_url')
                  .ilike('pseudo_norm', `%${term}%`)
                  .limit(8),
                10000
              )) || [];

              const candidates = users.filter(u => !memberIds.has(u.id) && !pendingIds.has(u.id));
              if (!candidates.length) {
                resBox.innerHTML = `<p class="muted" style="font-size:.84rem;margin:2px 0">Aucun utilisateur disponible trouvé.</p>`;
                return;
              }
              resBox.innerHTML = candidates.map(u => `
                <button type="button" class="mem-pick" data-send-inv="${u.id}">
                  <span style="display:flex;align-items:center;gap:8px">
                    ${avatarHtml(u, 'xs')}
                    <b>@${esc(u.pseudo)}</b>
                  </span>
                  <span class="btn pri sm" style="padding:5px 12px;font-size:.8rem">Inviter</span>
                </button>`).join('');
            } catch (ex) {
              resBox.innerHTML = `<div class="err" style="padding:8px 12px;font-size:.85rem">${esc(humanizeError(ex))}</div>`;
            }
          }, 250);

          searchInp.oninput = runUserSearch;

          resBox.onclick = async e => {
            const pick = e.target.closest('[data-send-inv]');
            if (!pick) return;
            const targetUid = pick.dataset.sendInv;
            const roleSel = body.querySelector('#cmInviteRole');
            const inviteRole = (cal.role === 'owner' && roleSel) ? roleSel.value : 'member';

            await runAction(pick, 'Envoi…', async () => {
              await safeMutate(async () => ok(
                await db.from('shared_calendar_invitations').insert({
                  calendar_id: cal.id,
                  invited_by: ME.id,
                  invited_user_id: targetUid,
                  role: inviteRole
                })
              ), 'L’envoi de l’invitation');
              toast('Invitation envoyée');
              await refreshModal();
            });
          };
        }
      } catch (ex) {
        body.innerHTML = `<div class="err">${esc(humanizeError(ex))}</div>`;
      }
    };

    await refreshModal();
  });
}

function confirmDeleteMeal(meal, onDeleted) {
  const isShared = CAL_SPACE === 'shared';
  const table = isShared ? 'shared_calendar_meals' : 'personal_meals';
  confirmDialog({
    title: 'Supprimer ce repas ?',
    name: `${MEAL_TYPE_LABEL[meal.meal_type] || meal.meal_type} — ${meal.recipe_title}`,
    text: `Ce repas prévu le ${parseIso(meal.meal_date).toLocaleDateString('fr-FR')} sera retiré du calendrier.`,
    confirmLabel: 'Supprimer',
    onConfirm: async () => {
      await safeMutate(async () => {
        let q = db.from(table).delete().eq('id', meal.id);
        if (!isShared) q = q.eq('user_id', ME.id);
        ok(await q);
      }, 'La suppression du repas');
      toast('Repas supprimé');
      if (onDeleted) onDeleted();
      await viewCalendar();
    }
  });
}

function openMoveMealModal(meal) {
  const isShared = CAL_SPACE === 'shared';
  const table = isShared ? 'shared_calendar_meals' : 'personal_meals';
  const baseDate = parseIso(meal.meal_date);
  const plus1 = calIso(addDays(baseDate, 1));
  const plus2 = calIso(addDays(baseDate, 2));
  const plus7 = calIso(addDays(baseDate, 7));

  openModal(`
    <h2>Déplacer le repas</h2>
    <div class="nm">${esc(meal.recipe_title)}</div>
    <form class="form" id="mvForm">
      <label for="mvDate">Nouvelle date *</label>
      <input type="date" id="mvDate" value="${esc(meal.meal_date)}" required>
      <div class="pm-quick-dates">
        <button class="btn ghost sm" type="button" data-qdate="${plus1}">Lendemain</button>
        <button class="btn ghost sm" type="button" data-qdate="${plus2}">+2 jours</button>
        <button class="btn ghost sm" type="button" data-qdate="${plus7}">Semaine suivante (+7 j)</button>
      </div>
      <div class="mb">
        <button class="btn ghost" id="mvCancel" type="button">Annuler</button>
        <button class="btn pri" id="mvSave" type="submit">Déplacer</button>
      </div>
    </form>`, (el, close) => {
    const dateInp = el.querySelector('#mvDate');
    el.querySelector('#mvCancel').onclick = close;
    el.querySelectorAll('[data-qdate]').forEach(b => {
      b.onclick = () => { dateInp.value = b.dataset.qdate; };
    });
    el.querySelector('#mvForm').onsubmit = async e => {
      e.preventDefault();
      const nextDate = dateInp.value;
      if (!nextDate) return toast('Choisissez une date valide', true);
      await runAction(el.querySelector('#mvSave'), 'Déplacement…', async () => {
        await safeMutate(async () => {
          let q = db.from(table)
            .update({ meal_date: nextDate, updated_at: new Date().toISOString() })
            .eq('id', meal.id);
          if (!isShared) q = q.eq('user_id', ME.id);
          ok(await q);
        }, 'Le déplacement du repas');
        CAL_SELECTED = nextDate;
        CAL_CURSOR = parseIso(nextDate);
        toast('Repas déplacé');
        close();
        await viewCalendar();
      });
    };
  });
}

async function openMealModal(dateIso, existingMeal = null) {
  let recipes = [];
  try {
    recipes = await ensureMyCalRecipes();
  } catch (e) {
    toast(humanizeError(e), true);
    return;
  }

  const isShared = CAL_SPACE === 'shared';
  const activeShared = isShared ? SHARED_CALS.find(c => c.id === CAL_SHARED_ID) : null;
  if (isShared && !activeShared) return;
  if (isShared && activeShared.role === 'member' && !activeShared.can_edit_meals) {
    toast('Vous êtes en lecture seule sur ce calendrier partagé', true);
    return;
  }

  let selType = existingMeal?.meal_type || 'dejeuner';
  let selRecipeId = existingMeal?.recipe_id || '';
  let customTitle = !existingMeal?.recipe_id && existingMeal?.recipe_title ? existingMeal.recipe_title : '';
  let searchQ = '';
  let forEveryone = existingMeal ? existingMeal.for_everyone !== false : true;
  let selectedAssignees = new Set(!forEveryone ? (existingMeal?.assignee_ids || []) : []);

  openModal(`
    <h2>${existingMeal ? 'Modifier le repas' : 'Planifier un repas'}</h2>
    ${isShared ? `<p class="muted" style="margin:-4px 0 10px;font-size:.88rem">Calendrier partagé : <b>${esc(activeShared.name)}</b></p>` : ''}
    ${existingMeal?.recipe_id ? `
      <div class="prov" style="margin:10px 0 6px">
        <span>Recette associée : <b>${esc(existingMeal.recipe_title)}</b></span>
        <a class="btn sm pri" id="pmViewRec" href="#/recette/${existingMeal.recipe_id}">Voir la recette →</a>
      </div>` : ''}
    <form class="form" id="pmForm">
      <label for="pmDate">Date *</label>
      <input type="date" id="pmDate" value="${esc(dateIso || calIso(new Date()))}" required>

      <label>Moment du repas *</label>
      <div class="pm-types" id="pmTypes">
        ${MEAL_TYPES.map(([k, l]) => `<button type="button" class="pm-type-btn ${selType === k ? 'on' : ''}" data-pmt="${k}">${esc(l)}</button>`).join('')}
      </div>

      ${isShared ? `
        <label>Pour qui ? *</label>
        <div class="pm-assign-box">
          <div class="pm-assign-chips" id="pmAssignChips">
            <button type="button" class="pm-who-btn ${forEveryone ? 'on' : ''}" data-who-all="1">Tout le monde</button>
            ${ACTIVE_CAL_MEMBERS.map(mem => `
              <button type="button" class="pm-who-btn ${!forEveryone && selectedAssignees.has(mem.user_id) ? 'on' : ''}" data-who-uid="${mem.user_id}">
                ${avatarHtml({ id: mem.user_id, pseudo: mem.pseudo, avatar_url: mem.avatar_url }, 'xs')}
                <span>@${esc(mem.pseudo)}</span>
              </button>`).join('')}
          </div>
          <div class="muted" id="pmAssignHint" style="font-size:.8rem;margin-top:7px">
            ${forEveryone ? 'Tous les membres du calendrier sont concernés.' : `${selectedAssignees.size} personne${selectedAssignees.size > 1 ? 's' : ''} sélectionnée${selectedAssignees.size > 1 ? 's' : ''}.`}
          </div>
        </div>` : ''}

      <label for="pmSearch">Choisir une recette de ma bibliothèque *</label>
      <input id="pmSearch" type="search" placeholder="Rechercher par nom ou catégorie…" autocomplete="off">
      <div id="pmRecBox"></div>

      <label for="pmCustom" style="font-weight:500;color:var(--mute)">Ou saisir un intitulé libre (si hors bibliothèque)</label>
      <input id="pmCustom" value="${esc(customTitle)}" placeholder="Ex. Restes de la veille, Pique-nique…">

      <label for="pmNote">Note (facultatif)</label>
      <input id="pmNote" value="${esc(existingMeal?.note || '')}" placeholder="Ex. Préparer la veille, 2 portions…">

      <div class="mb" style="justify-content:space-between;flex-wrap:wrap">
        ${existingMeal
          ? `<button class="btn del" id="pmDel" type="button">Supprimer</button>`
          : `<span></span>`}
        <div style="display:flex;gap:10px;margin-left:auto">
          <button class="btn ghost" id="pmCancel" type="button">Annuler</button>
          <button class="btn pri" id="pmSave" type="submit">${existingMeal ? 'Enregistrer' : 'Ajouter'}</button>
        </div>
      </div>
    </form>`, (el, close) => {
    const viewRecLink = el.querySelector('#pmViewRec');
    if (viewRecLink) viewRecLink.onclick = () => close();

    el.querySelector('#pmCancel').onclick = close;
    const delBtn = el.querySelector('#pmDel');
    if (delBtn && existingMeal) {
      delBtn.onclick = () => confirmDeleteMeal(existingMeal, close);
    }

    const typesBox = el.querySelector('#pmTypes');
    typesBox.onclick = e => {
      const b = e.target.closest('[data-pmt]');
      if (!b) return;
      selType = b.dataset.pmt;
      typesBox.querySelectorAll('.pm-type-btn').forEach(x => x.classList.toggle('on', x.dataset.pmt === selType));
    };

    const assignBox = el.querySelector('#pmAssignChips');
    const assignHint = el.querySelector('#pmAssignHint');
    if (assignBox) {
      const syncAssignUI = () => {
        const allBtn = assignBox.querySelector('[data-who-all]');
        if (allBtn) allBtn.classList.toggle('on', forEveryone);
        assignBox.querySelectorAll('[data-who-uid]').forEach(b => {
          b.classList.toggle('on', !forEveryone && selectedAssignees.has(b.dataset.whoUid));
        });
        if (assignHint) {
          assignHint.textContent = forEveryone
            ? 'Tous les membres du calendrier sont concernés.'
            : (selectedAssignees.size
                ? `${selectedAssignees.size} personne${selectedAssignees.size > 1 ? 's' : ''} sélectionnée${selectedAssignees.size > 1 ? 's' : ''}.`
                : 'Sélectionnez au moins un membre ou choisissez « Tout le monde ».');
        }
      };

      assignBox.onclick = e => {
        const allBtn = e.target.closest('[data-who-all]');
        if (allBtn) {
          forEveryone = true;
          selectedAssignees.clear();
          syncAssignUI();
          return;
        }
        const uidBtn = e.target.closest('[data-who-uid]');
        if (uidBtn) {
          const uid = uidBtn.dataset.whoUid;
          forEveryone = false;
          if (selectedAssignees.has(uid)) selectedAssignees.delete(uid);
          else selectedAssignees.add(uid);
          syncAssignUI();
        }
      };
    }

    const customInp = el.querySelector('#pmCustom');
    customInp.oninput = e => {
      customTitle = e.target.value;
      if (customTitle.trim()) {
        selRecipeId = '';
        renderRecList();
      }
    };

    const recBox = el.querySelector('#pmRecBox');
    const renderRecList = () => {
      if (!recipes.length) {
        recBox.innerHTML = `<p class="muted" style="font-size:.86rem;margin:6px 0">Aucune recette dans votre bibliothèque. <a href="#/nouvelle" id="pmNewRec" style="color:var(--accent);font-weight:700">Créer une recette</a> ou saisissez un intitulé libre ci-dessous.</p>`;
        const lnk = recBox.querySelector('#pmNewRec');
        if (lnk) lnk.onclick = () => close();
        return;
      }
      const q = norm(searchQ);
      const filtered = recipes.filter(r => !q || norm(r.title).includes(q) || norm(r.category || '').includes(q));
      if (!filtered.length) {
        recBox.innerHTML = `<p class="muted" style="font-size:.86rem;margin:6px 0">Aucune recette trouvée pour « ${esc(searchQ)} ».</p>`;
        return;
      }
      recBox.innerHTML = `<div class="pm-rec-list">
        ${filtered.slice(0, 40).map(r => {
          const totalMin = (r.prep_min || 0) + (r.cook_min || 0);
          return `<button type="button" class="pm-rec-item ${r.id === selRecipeId ? 'on' : ''}" data-pickrec="${r.id}">
            ${r.cover_url ? `<img src="${esc(r.cover_url)}" alt="">` : `<div class="pm-rec-ph">🍽</div>`}
            <div style="min-width:0;flex:1">
              <div style="font-weight:700;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.title)}</div>
              <div class="muted" style="font-size:.78rem">${r.category ? esc(r.category) + ' • ' : ''}${totalMin} min</div>
            </div>
          </button>`;
        }).join('')}
      </div>`;
    };

    recBox.onclick = e => {
      const btn = e.target.closest('[data-pickrec]');
      if (!btn) return;
      selRecipeId = btn.dataset.pickrec;
      customTitle = '';
      customInp.value = '';
      renderRecList();
    };

    el.querySelector('#pmSearch').oninput = e => {
      searchQ = e.target.value;
      renderRecList();
    };
    renderRecList();

    el.querySelector('#pmForm').onsubmit = async e => {
      e.preventDefault();
      const mealDate = el.querySelector('#pmDate').value;
      const note = el.querySelector('#pmNote').value.trim();
      const chosenRec = selRecipeId ? recipes.find(r => r.id === selRecipeId) : null;
      const finalTitle = chosenRec ? chosenRec.title : customTitle.trim();

      if (!mealDate) return toast('Veuillez choisir une date', true);
      if (!finalTitle) return toast('Sélectionnez une recette ou saisissez un intitulé', true);
      if (isShared && !forEveryone && selectedAssignees.size === 0) {
        return toast('Choisissez « Tout le monde » ou sélectionnez au moins une personne', true);
      }

      const assigneeIds = forEveryone ? [] : [...selectedAssignees];
      const basePayload = {
        meal_date: mealDate,
        meal_type: selType,
        recipe_id: chosenRec ? chosenRec.id : null,
        recipe_title: finalTitle,
        recipe_cover_url: chosenRec ? (chosenRec.cover_url || null) : null,
        note: note || null,
        updated_at: new Date().toISOString()
      };

      await runAction(el.querySelector('#pmSave'), 'Enregistrement…', async () => {
        await safeMutate(async () => {
          if (isShared) {
            let mealId = existingMeal?.id;
            if (mealId) {
              ok(await db.from('shared_calendar_meals')
                .update({ ...basePayload, for_everyone: forEveryone })
                .eq('id', mealId));
              ok(await db.from('shared_calendar_meal_assignees')
                .delete()
                .eq('meal_id', mealId));
            } else {
              const inserted = ok(await db.from('shared_calendar_meals')
                .insert({
                  ...basePayload,
                  calendar_id: activeShared.id,
                  created_by: ME.id,
                  for_everyone: forEveryone
                })
                .select('id')
                .single());
              mealId = inserted.id;
            }

            if (!forEveryone && assigneeIds.length) {
              ok(await db.from('shared_calendar_meal_assignees')
                .insert(assigneeIds.map(uid => ({ meal_id: mealId, user_id: uid }))));
            }
          } else {
            if (existingMeal) {
              ok(await db.from('personal_meals').update(basePayload).eq('id', existingMeal.id).eq('user_id', ME.id));
            } else {
              ok(await db.from('personal_meals').insert({ ...basePayload, user_id: ME.id }));
            }
          }
        }, 'L’enregistrement du repas');

        CAL_SELECTED = mealDate;
        CAL_CURSOR = parseIso(mealDate);
        toast(existingMeal ? 'Repas mis à jour' : 'Repas ajouté au calendrier');
        close();
        await viewCalendar();
      });
    };
  });
}

boot();
</script>
